<body>

<div id="root"></div>

<script type="text/babel" data-presets="react">

const {
  useState,
  useEffect,
  useRef
}=React;


/* =========================================================
   COUNTRIES
========================================================= */

const COUNTRIES=[
  {code:"SA",name:"السعودية",dialect:"السعودية",currency:"ريال سعودي"},
  {code:"AE",name:"الإمارات",dialect:"الإماراتية",currency:"درهم إماراتي"},
  {code:"KW",name:"الكويت",dialect:"الكويتية",currency:"دينار كويتي"},
  {code:"QA",name:"قطر",dialect:"القطرية",currency:"ريال قطري"},
  {code:"BH",name:"البحرين",dialect:"البحرينية",currency:"دينار بحريني"},
  {code:"OM",name:"عُمان",dialect:"العُمانية",currency:"ريال عُماني"},
  {code:"IQ",name:"العراق",dialect:"العراقية",currency:"دينار عراقي"},
  {code:"JO",name:"الأردن",dialect:"الأردنية",currency:"دينار أردني"},
  {code:"PS",name:"فلسطين",dialect:"الفلسطينية",currency:"شيكل"},

  {code:"SY",name:"سوريا",dialect:"السورية",currency:"ليرة سورية"},
  {code:"EG",name:"مصر",dialect:"المصرية",currency:"جنيه مصري"},
  {code:"SD",name:"السودان",dialect:"السودانية",currency:"جنيه سوداني"},
  {code:"LY",name:"ليبيا",dialect:"الليبية",currency:"دينار ليبي"},
  {code:"TN",name:"تونس",dialect:"التونسية",currency:"دينار تونسي"},
  {code:"DZ",name:"الجزائر",dialect:"الجزائرية",currency:"دينار جزائري"},
  {code:"MA",name:"المغرب",dialect:"المغربية",currency:"درهم مغربي"},
  {code:"MR",name:"موريتانيا",dialect:"الموريتانية",currency:"أوقية موريتانية"},
  {code:"YE",name:"اليمن",dialect:"اليمنية",currency:"ريال يمني"},
  {code:"DJ",name:"جيبوتي",dialect:"المحلية",currency:"فرنك جيبوتي"},
  {code:"SO",name:"الصومال",dialect:"الصومالية",currency:"شلن صومالي"},
  {code:"KM",name:"جزر القمر",dialect:"القمرية",currency:"فرنك قمري"}
];


/* =========================================================
   VISUAL STYLES
========================================================= */

const STYLE_SEEDS=[
  "فخامة داكنة: خلفية سوداء وكحلية عميقة، لمسات ذهبية، Typography فاخرة وإحساس Premium",
  "Glassmorphism: بطاقات زجاجية، توهج سماوي، خلفية داكنة، حدود مضيئة وتأثيرات حديثة",
  "Minimal Luxury: أبيض ورمادي فاتح، لون رئيسي واحد، مساحات واسعة وتصميم راقٍ جداً",
  "Warm Commerce: ألوان دافئة مثل البرتقالي والذهبي، CTA قوي، إحساس متجر ناجح",
  "Modern Tech: بنفسجي وكحلي مع Neon glow، خطوط هندسية وتأثيرات مستقبلية",
  "Natural Premium: بيج، أخضر زيتوني، بني فاتح، إحساس طبيعي وعضوي",
  "Bold Social Ads: تصميم قوي ومباشر، عناوين ضخمة، بطاقات جذابة وCTA واضح مناسب لإعلانات TikTok وFacebook"
];

function pickStyle(){
  return STYLE_SEEDS[
    Math.floor(Math.random()*STYLE_SEEDS.length)
  ];
}


/* =========================================================
   HELPERS
========================================================= */

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();

    reader.onload=()=>{
      resolve(reader.result);
    };

    reader.onerror=reject;

    reader.readAsDataURL(file);
  });
}

function dataUrlParts(dataUrl){
  const match=/^data:(.+?);base64,(.+)$/.exec(dataUrl||"");

  return match
    ? {
        mediaType:match[1],
        base64:match[2]
      }
    : null;
}

function formatPrice(value,country){
  const number=Number(value);

  if(Number.isNaN(number)){
    return value+" "+country.currency;
  }

  return number.toLocaleString("en-US")+" "+country.currency;
}

function calculateDiscount(original,sale){
  const oldPrice=Number(original);
  const newPrice=Number(sale);

  if(
    !oldPrice ||
    !newPrice ||
    oldPrice<=newPrice
  ){
    return 0;
  }

  return Math.round(
    ((oldPrice-newPrice)/oldPrice)*100
  );
}

function extractHTML(text){

  let result=(text||"").trim();

  result=result
    .replace(/^```html/i,"")
    .replace(/^```/,"")
    .replace(/```\s*$/i,"")
    .trim();

  const start=result.search(/<!DOCTYPE html>|<html/i);

  if(start>0){
    result=result.slice(start);
  }

  const end=result.toLowerCase().lastIndexOf("</html>");

  if(end!==-1){
    result=result.slice(0,end+7);
  }

  return result;
}

function injectImages(html,images){

  let result=html;

  for(let i=0;i<4;i++){

    const token=`IMAGE_${i+1}_PLACEHOLDER`;

    result=result
      .split(token)
      .join(images[i]?.dataUrl||"");
  }

  return result;
}


/* =========================================================
   AI REQUEST
========================================================= */

async function callClaude(content,maxTokens){

  const response=await fetch("/api/generate",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      content,
      max_tokens:maxTokens
    })
  });

  const data=await response.json();

  if(!response.ok){
    throw new Error(
      data.error ||
      "تعذّر الاتصال بمحرك الذكاء الاصطناعي."
    );
  }

  if(!data.text){
    throw new Error("لم يصل رد من محرك الذكاء الاصطناعي.");
  }

  return data.text;
}


/* =========================================================
   PROMPT
========================================================= */

function buildCreativePrompt(
  form,
  country,
  imagesCount,
  styleSeed,
  extraInstruction
){

  const discount=calculateDiscount(
    form.originalPrice,
    form.price
  );

  return `
أنت مصمم ومطور Landing Pages احترافي متخصص في التجارة الإلكترونية العربية.

مهمتك إنشاء صفحة هبوط HTML كاملة وجاهزة للاستخدام لمنتج واحد.

الهدف الأساسي:
إنشاء صفحة Landing Page عالية التحويل مناسبة لإعلانات Facebook وTikTok وSnapchat، ومصممة أولاً للهاتف.

========================
بيانات المنتج
========================

اسم المنتج:
${form.name}

السعر الأصلي:
${form.originalPrice} ${country.currency}

سعر البيع:
${form.price} ${country.currency}

نسبة الخصم التقريبية:
${discount > 0 ? discount+"%" : "لا يوجد خصم"}

الدولة:
${country.name}

اللهجة:
${form.dialect==="auto"
  ? country.dialect+" تلقائياً"
  : form.dialect}

الوصف:
${form.description || "غير متوفر — استنتج المعلومات من صور المنتج بدون اختلاق مواصفات غير ظاهرة."}

عدد الصور:
${imagesCount}

فورم الطلب:
${
  form.includeOrderForm
    ? "نعم، أضف فورم طلب بسيط"
    : "لا، لا تضف فورم. استخدم CTA فقط."
}

========================
الهوية البصرية
========================

${styleSeed}

كل عملية توليد يجب أن تبدو مختلفة عن السابقة.

لا تستخدم قالباً ثابتاً.

========================
الصور
========================

استخدم فقط:

${Array.from(
  {length:imagesCount},
  (_,i)=>`IMAGE_${i+1}_PLACEHOLDER`
).join(", ")}

لا تستخدم صوراً من الإنترنت.

لا تخترع صوراً.

========================
قواعد المحتوى
========================

- اكتب بالعربية.
- استخدم اللهجة المطلوبة بشكل طبيعي.
- لا تستخدم لغة روبوتية.
- لا تكرر نفس الجمل.
- لا تضع ادعاءات طبية أو نتائج غير مثبتة.
- لا تخترع مواصفات غير واضحة من الصور.
- اجعل النصوص قصيرة وقوية.
- ركز على الفوائد الحقيقية للعميل.
- CTA واضح ومكرر بشكل منطقي.
- إذا كان هناك سعر أصلي وسعر بيع، اعرض السعر الأصلي مشطوباً وسعر البيع بشكل بارز.
- لا تذكر أي شيء عن "صافي الربح".
- لا تذكر تكلفة المنتج.
- لا تذكر أن الصفحة مولدة بالذكاء الاصطناعي.

========================

========================

يمكن استخدام:

Benefits
Features
Product Gallery

Social Proof

CTA

لا تضف أقساماً لمجرد ملء الصفحة.

========================

========================

- RTL بالكامل.
- Mobile-first.
- عرض الهاتف تقريباً 390-480px.
- Responsive.

========================

========================

أضف:

meta description
Open Graph

ويجب أن يحتوي JSON-LD على:

السعر الحالي
العملة

========================
قواعد تقنية
========================

2. يبدأ بـ <!DOCTYPE html>.
3. ينتهي بـ </html>.

5. لا شرح خارج HTML.
6. CSS داخل <style>.
7. JavaScript داخل <script>.
8. لا تستعمل React داخل Landing Page النهائية.

========================

${extraInstruction
  ? "توجيه إضافي من المستخدم: "+extraInstruction
  : ""}

أنشئ الآن صفحة هبوط احترافية كاملة.
`;
}


/* =========================================================
   APP
========================================================= */

function App(){

  const [step,setStep]=useState("form");

  const [form,setForm]=useState({
    name:"",
    originalPrice:"",
    price:"",
    description:"",
    countryCode:"SA",
    dialect:"auto",
    includeOrderForm:false
  });

  const [images,setImages]=useState([]);

  const [error,setError]=useState("");

  const [genStepIdx,setGenStepIdx]=useState(0);

  const [history,setHistory]=useState([]);

  const [historyIdx,setHistoryIdx]=useState(-1);

  const html=
    historyIdx>=0
      ? history[historyIdx]
      : null;

  const [previewMode,setPreviewMode]=useState("mobile");

  const [regenNote,setRegenNote]=useState("");

  const [regenerating,setRegenerating]=useState(false);

  const [copyStatus,setCopyStatus]=useState("");

  const country=
    COUNTRIES.find(
      c=>c.code===form.countryCode
    )||COUNTRIES[0];


  const GEN_STEPS=[
    "جاري تحليل صور المنتج…",
    "جاري تحديد الهوية البصرية…",
    "جاري بناء هيكلة الصفحة…",
    "جاري كتابة المحتوى التسويقي…",
    "جاري تحسين تجربة الهاتف…",
    "جاري إضافة اللمسات النهائية…"
  ];

  const timerRef=useRef(null);

  useEffect(()=>{

    if(step==="loading"){

      setGenStepIdx(0);

      timerRef.current=setInterval(()=>{

        setGenStepIdx(
          current=>
            current<GEN_STEPS.length-1
              ? current+1
              : current
        );

      },1500);

    }else{

      if(timerRef.current){
        clearInterval(timerRef.current);
      }

    }

    return ()=>{
      if(timerRef.current){
        clearInterval(timerRef.current);
      }
    };

  },[step]);


  /* =====================================================
     IMAGE UPLOAD
  ===================================================== */

  async function handleImageUpload(event){

    const files=
      Array.from(event.target.files||[])
      .slice(0,4-images.length);

    const next=[];

    for(const file of files){

      try{

        const dataUrl=
          await fileToDataUrl(file);

        const parts=
          dataUrlParts(dataUrl);

        if(parts){

          next.push({
            dataUrl,
            mediaType:parts.mediaType,
            base64:parts.base64
          });

        }

      }catch(error){}

    }

    setImages(
      previous=>
        [...previous,...next].slice(0,4)
    );

    event.target.value="";
  }


  function removeImage(index){

    setImages(
      previous=>
        previous.filter(
          (_,i)=>i!==index
        )
    );
  }


  /* =====================================================
     GENERATION
  ===================================================== */

  async function runGeneration(extraInstruction){

    const styleSeed=pickStyle();

    const content=[
      {
        type:"text",
        text:buildCreativePrompt(
          form,
          country,
          images.length,
          styleSeed,
          extraInstruction
        )
      },
      ...images.map(image=>({
        type:"image",
        source:{
          type:"base64",
          media_type:image.mediaType,
          data:image.base64
        }
      }))
    ];

    const raw=
      await callClaude(
        content,
        9000
      );

    const clean=
      injectImages(
        extractHTML(raw),
        images
      );

    if(
      !clean ||
      clean.length<100
    ){
      throw new Error(
        "الصفحة الناتجة غير مكتملة."
      );
    }

    return clean;
  }


  async function handleGenerate(){

    setError("");

    if(!form.name.trim()){
      return setError(
        "أدخل اسم المنتج أولاً."
      );
    }

    if(!form.originalPrice){
      return setError(
        "أدخل السعر الأصلي."
      );
    }

    if(!form.price){
      return setError(
        "أدخل سعر البيع."
      );
    }

    if(images.length===0){
      return setError(
        "ارفع صورة واحدة على الأقل."
      );
    }

    setStep("loading");

    try{

      const result=
        await runGeneration(null);

      setHistory([result]);

      setHistoryIdx(0);

      setStep("preview");

    }catch(error){

      setError(
        error.message ||
        "حدث خطأ أثناء التوليد."
      );

      setStep("form");
    }
  }


  async function handleRegenerate(){

    if(!regenNote.trim()){
      return;
    }

    setRegenerating(true);

    setError("");

    try{

      const result=
        await runGeneration(
          regenNote.trim()
        );

      const previous=
        history.slice(
          0,
          historyIdx+1
        );

      const next=[
        ...previous,
        result
      ];

      setHistory(next);

      setHistoryIdx(
        next.length-1
      );

      setRegenNote("");

    }catch(error){

      setError(
        error.message ||
        "تعذّر إعادة التصميم."
      );

    }finally{

      setRegenerating(false);
    }
  }


  function undo(){

    if(historyIdx>0){
      setHistoryIdx(
        historyIdx-1
      );
    }
  }


  function redo(){

    if(historyIdx<history.length-1){
      setHistoryIdx(
        historyIdx+1
      );
    }
  }


  /* =====================================================
     COPY
  ===================================================== */

  async function copyHTML(){

    try{

      await navigator.clipboard.writeText(
        html
      );

      setCopyStatus(
        "تم نسخ HTML ✓"
      );

    }catch{

      setCopyStatus(
        "تعذّر النسخ التلقائي."
      );
    }

    setTimeout(
      ()=>setCopyStatus(""),
      2500
    );
  }


  /* =====================================================
     DOWNLOAD
  ===================================================== */

  function downloadHTML(){

    const blob=
      new Blob(
        [html],
        {
          type:"text/html;charset=utf-8"
        }
      );

    const url=
      URL.createObjectURL(blob);

    const link=
      document.createElement("a");

    link.href=url;

    link.download=
      (
        form.name||
        "landing-page"
      )
      .trim()
      .replace(/\s+/g,"-")
      +".html";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);
  }


  /* =====================================================
     PREVIEW
  ===================================================== */

  const iframeRef=
    useRef(null);

  const [iframeHeight,setIframeHeight]=
    useState(700);

  function handleIframeLoad(){

    try{

      const doc=
        iframeRef.current.contentDocument;

      const height=
        Math.max(
          doc.documentElement.scrollHeight,
          doc.body.scrollHeight
        );

      setIframeHeight(
        height+20
      );

    }catch(error){}
  }


  /* =====================================================
     JPG
  ===================================================== */

  const [exportingJPG,setExportingJPG]=
    useState(false);

  async function downloadJPG(){

    if(
      !iframeRef.current ||
      !window.html2canvas
    ){
      return;
    }

    setExportingJPG(true);

    setError("");

    try{

      const doc=
        iframeRef.current.contentDocument;

      const canvas=
        await window.html2canvas(
          doc.body,
          {
            useCORS:true,
            backgroundColor:null,
            scale:2,
            windowWidth:
              doc.documentElement.scrollWidth,
            windowHeight:
              doc.documentElement.scrollHeight
          }
        );

      const link=
        document.createElement("a");

      link.href=
        canvas.toDataURL(
          "image/jpeg",
          .95
        );

      link.download=
        (
          form.name||
          "landing-page"
        )
        .trim()
        .replace(/\s+/g,"-")
        +".jpg";

      document.body.appendChild(link);

      link.click();

      link.remove();

    }catch(error){

      setError(
        "تعذّر تصدير JPG."
      );

    }finally{

      setExportingJPG(false);
    }
  }


  return(

    <div
      dir="rtl"
      style={{
        minHeight:"100vh",
        background:"#080c14",
        fontFamily:"'Cairo',sans-serif"
      }}
    >

      {step==="form" && (

        <FormScreen
          form={form}
          setForm={setForm}
          images={images}
          onUpload={handleImageUpload}
          onRemoveImage={removeImage}
          error={error}
          onGenerate={handleGenerate}
        />

      )}

      {step==="loading" && (

        <LoadingScreen
          stepIdx={genStepIdx}
          steps={GEN_STEPS}
        />

      )}

      {step==="preview" && html && (

        <PreviewScreen
          html={html}
          iframeRef={iframeRef}
          iframeHeight={iframeHeight}
          onIframeLoad={handleIframeLoad}
          previewMode={previewMode}
          setPreviewMode={setPreviewMode}
          regenNote={regenNote}
          setRegenNote={setRegenNote}
          onRegenerate={handleRegenerate}
          regenerating={regenerating}
          canUndo={historyIdx>0}
          canRedo={
            historyIdx<
            history.length-1
          }
          onUndo={undo}
          onRedo={redo}
          onCopy={copyHTML}
          onDownload={downloadHTML}
          onDownloadJPG={downloadJPG}
          exportingJPG={exportingJPG}
          copyStatus={copyStatus}
          error={error}
          onBack={()=>setStep("form")}
        />

      )}

    </div>
  );
}


/* =========================================================
   FORM SCREEN
========================================================= */

function FormScreen({
  form,
  setForm,
  images,
  onUpload,
  onRemoveImage,
  error,
  onGenerate
}){

  const country=
    COUNTRIES.find(
      c=>c.code===form.countryCode
    )||COUNTRIES[0];

  const discount=
    calculateDiscount(
      form.originalPrice,
      form.price

  return(

    <div
      className="fade"
      style={{
        width:"100%",
        maxWidth:680,

        padding:"45px 18px 80px"

        style={{

        <div

            alignItems:"center",
            gap:8,
            padding:"7px 15px",
            borderRadius:50,
            background:"#111a2c",
            border:"1px solid #20304b",
            color:"#22d3ee",
            fontSize:12,
            fontWeight:700,

        <h1
          style={{
            fontSize:30,
            lineHeight:1.45,
            margin:"0 0 10px",
            fontWeight:900,
            color:"#f8fafc"

          <span style={{color:"#22d3ee"}}>

        </h1>

        <p
          style={{
            color:"#8995aa",
            fontSize:14,
            margin:0
          }}
        >
          أدخل معلومات منتجك، وارفع صوره، واترك التصميم والمحتوى للذكاء الاصطناعي.
        </p>

      </div>


      {/* MAIN CARD */}

      <div
        style={{
          background:"#111827",
          border:"1px solid #202b42",
          borderRadius:20,
          padding:22,
          boxShadow:"0 20px 60px rgba(0,0,0,.25)"
        }}
      >

        <div
          style={{
            display:"grid",
            gap:18
          }}
        >

          {/* PRODUCT NAME */}

          <Field label="اسم المنتج">

            <input
              value={form.name}
              onChange={e=>
                setForm(
                  f=>({
                    ...f,
                    name:e.target.value
                  })
                )
              }
              placeholder="مثال: جهاز تنظيف بالبخار"
              style={inputStyle}
            />

          </Field>


          {/* PRICES */}

          <div
            className="formGrid"
            style={{
              display:"grid",
              gridTemplateColumns:"1fr 1fr",
              gap:12
            }}
          >

            <Field label="السعر الأصلي">

              <div style={{position:"relative"}}>

                <input
                  type="number"
                  min="0"
                  value={form.originalPrice}
                  onChange={e=>
                    setForm(
                      f=>({
                        ...f,
                        originalPrice:e.target.value
                      })
                    )
                  }
                  placeholder="مثال: 299"
                  style={inputStyle}
                />

              </div>

            </Field>


            <Field label="سعر البيع">

              <input
                type="number"
                min="0"
                value={form.price}
                onChange={e=>
                  setForm(
                    f=>({
                      ...f,
                      price:e.target.value
                    })
                  )
                }
                placeholder="مثال: 149"
                style={{
                  ...inputStyle,
                  borderColor:"#22d3ee"
                }}
              />

            </Field>

          </div>


          {/* PRICE PREVIEW */}

          {form.originalPrice &&
           form.price &&
           Number(form.originalPrice)>Number(form.price) && (

            <div
              style={{
                background:"#0b1623",
                border:"1px solid #18354a",
                borderRadius:12,
                padding:"10px 13px",
                display:"flex",
                alignItems:"center",
                justifyContent:"space-between",
                gap:10
              }}
            >

              <div>

                <span
                  style={{
                    color:"#64748b",
                    fontSize:11
                  }}
                >
                  عرض السعر
                </span>

                <div
                  style={{
                    display:"flex",
                    alignItems:"center",
                    gap:8
                  }}
                >

                  <span
                    style={{
                      color:"#64748b",
                      textDecoration:"line-through",
                      fontSize:13
                    }}
                  >
                    {Number(form.originalPrice).toLocaleString("en-US")}
                  </span>

                  <strong
                    style={{
                      color:"#22d3ee",
                      fontSize:18
                    }}
                  >
                    {Number(form.price).toLocaleString("en-US")}
                  </strong>

                  <span
                    style={{
                      color:"#94a3b8",
                      fontSize:11
                    }}
                  >
                    {country.currency}
                  </span>

                </div>

              </div>

              <div
                style={{
                  background:"#123d32",
                  color:"#6ee7b7",
                  borderRadius:8,
                  padding:"5px 9px",
                  fontSize:11,
                  fontWeight:800
                }}
              >
                خصم {calculateDiscount(
                  form.originalPrice,
                  form.price
                )}%
              </div>

            </div>

          )}


          {/* IMAGES */}

          <Field label="صور المنتج — حتى 4 صور">

            <div
              style={{
                display:"grid",
                gridTemplateColumns:
                  "repeat(4,1fr)",
                gap:9
              }}
            >

              {images.map((img,index)=>(

                <div
                  key={index}
                  style={{
                    position:"relative",
                    aspectRatio:"1",
                    borderRadius:12,
                    overflow:"hidden",
                    border:"1px solid #29364d",
                    background:"#0b1220"
                  }}
                >

                  <img
                    src={img.dataUrl}
                    alt=""
                    style={{
                      width:"100%",
                      height:"100%",
                      objectFit:"cover"
                    }}
                  />

                  <button
                    onClick={()=>
                      onRemoveImage(index)
                    }
                    style={{
                      position:"absolute",
                      top:5,
                      left:5,
                      width:25,
                      height:25,
                      border:0,
                      borderRadius:7,
                      background:"rgba(0,0,0,.7)",
                      color:"#fff",
                      cursor:"pointer"
                    }}
                  >
                    ×
                  </button>

                </div>

              ))}


              {images.length<4 && (

                <label
                  style={{
                    aspectRatio:"1",
                    borderRadius:12,
                    border:"1.5px dashed #33435d",
                    display:"flex",
                    flexDirection:"column",
                    alignItems:"center",
                    justifyContent:"center",
                    gap:5,
                    cursor:"pointer",
                    color:"#718096",
                    background:"#0d1524"
                  }}
                >

                  <span
                    style={{
                      fontSize:22
                    }}
                  >
                    ＋
                  </span>

                  <span
                    style={{
                      fontSize:10
                    }}
                  >
                    إضافة صورة
                  </span>

                  <input
                    type="file"
                    accept="image/*"
                    multiple
                    onChange={onUpload}
                    style={{display:"none"}}
                  />

                </label>

              )}

            </div>

            <span
              style={{
                color:"#59657b",
                fontSize:11,
                display:"block",
                marginTop:6
              }}
            >
              يمكنك رفع حتى 4 صور للمنتج
            </span>

          </Field>


          {/* DESCRIPTION */}

          <Field label="وصف المنتج — اختياري">

            <textarea
              value={form.description}
              onChange={e=>
                setForm(
                  f=>({
                    ...f,
                    description:e.target.value
                  })
                )
              }
              placeholder="اكتب معلومات إضافية عن المنتج، أو اترك الحقل فارغاً ليحلل الذكاء الاصطناعي الصور."
              rows={4}
              style={{
                ...inputStyle,
                resize:"vertical",
                lineHeight:1.8
              }}
            />

          </Field>


          {/* COUNTRY + DIALECT */}

          <div
            className="formGrid"
            style={{
              display:"grid",
              gridTemplateColumns:"1fr 1fr",
              gap:12
            }}
          >

            <Field label="الدولة المستهدفة">

              <select
                value={form.countryCode}
                onChange={e=>
                  setForm(
                    f=>({
                      ...f,
                      countryCode:e.target.value
                    })
                  )
                }
                style={inputStyle}
              >

                {COUNTRIES.map(country=>

                  <option
                    key={country.code}
                    value={country.code}
                  >
                    {country.name}
                  </option>

                )}

              </select>

            </Field>


            <Field label="اللهجة">

              <select
                value={form.dialect}
                onChange={e=>
                  setForm(
                    f=>({
                      ...f,
                      dialect:e.target.value
                    })
                  )
                }
                style={inputStyle}
              >

                <option value="auto">
                  تلقائي حسب الدولة
                </option>

                {COUNTRIES.map(country=>

                  <option
                    key={country.code}
                    value={country.dialect}
                  >
                    {country.dialect}
                  </option>

                )}

              </select>

            </Field>

          </div>


          {/* ORDER FORM */}

          <Field label="فورم الطلب في الصفحة">

            <div
              style={{
                display:"grid",
                gridTemplateColumns:"1fr 1fr",
                gap:8
              }}
            >

              <button
                type="button"
                onClick={()=>
                  setForm(
                    f=>({
                      ...f,
                      includeOrderForm:false
                    })
                  )
                }
                style={{
                  ...toggleBtn,
                  background:
                    !form.includeOrderForm
                      ? "#22d3ee"
                      : "#0c1423",
                  color:
                    !form.includeOrderForm
                      ? "#06121a"
                      : "#aeb9ca",
                  borderColor:
                    !form.includeOrderForm
                      ? "#22d3ee"
                      : "#27354d"
                }}
              >
                زر طلب فقط
              </button>


              <button
                type="button"
                onClick={()=>
                  setForm(
                    f=>({
                      ...f,
                      includeOrderForm:true
                    })
                  )
                }
                style={{
                  ...toggleBtn,
                  background:
                    form.includeOrderForm
                      ? "#22d3ee"
                      : "#0c1423",
                  color:
                    form.includeOrderForm
                      ? "#06121a"
                      : "#aeb9ca",
                  borderColor:
                    form.includeOrderForm
                      ? "#22d3ee"
                      : "#27354d"
                }}
              >
                مع فورم الطلب
              </button>

            </div>

          </Field>


          {/* ERROR */}

          {error && (

            <div
              style={{
                background:"#29151a",
                border:"1px solid #4a222a",
                color:"#f87171",
                borderRadius:10,
                padding:"10px 12px",
                fontSize:12
              }}
            >
              {error}
            </div>

          )}


          {/* GENERATE */}

          <button
            onClick={onGenerate}
            style={{
              border:0,
              borderRadius:13,
              padding:"16px 20px",
              marginTop:4,
              cursor:"pointer",
              fontSize:16,
              fontWeight:900,
              color:"#031019",
              background:
                "linear-gradient(100deg,#3b82f6,#22d3ee)",
              boxShadow:
                "0 12px 30px rgba(34,211,238,.15)"
            }}
          >
            إنشاء صفحة الهبوط
            <span style={{marginRight:8}}>
              🚀
            </span>
          </button>

        </div>

      </div>


      {/* FOOTER */}

      <div
        style={{
          textAlign:"center",
          color:"#4e5a70",
          fontSize:11,
          marginTop:18
        }}
      >
        ذكاء اصطناعي لإنشاء صفحات هبوط مخصصة للتجارة الإلكترونية
      </div>

    </div>
  );
}


/* =========================================================
   FIELD
========================================================= */

function Field({label,children}){

  return(

    <label
      style={{
        display:"grid",
        gap:7
      }}
    >

      <span
        style={{
          color:"#b7c1d3",
          fontSize:12.5,
          fontWeight:700
        }}
      >
        {label}
      </span>

      {children}

    </label>
  );
}


/* =========================================================
   STYLES
========================================================= */

const inputStyle={
  width:"100%",
  background:"#0b1220",
  border:"1px solid #26334b",
  borderRadius:10,
  color:"#f1f5f9",
  padding:"12px 13px",
  fontSize:13.5,
  outline:"none"
};

const toggleBtn={
  border:"1px solid #27354d",
  borderRadius:10,
  padding:"11px 8px",
  fontSize:12,
  fontWeight:800,
  cursor:"pointer"
};


/* =========================================================
   LOADING
========================================================= */

function LoadingScreen({
  stepIdx,
  steps
}){

  const progress=
    ((stepIdx+1)/steps.length)*100;

  return(

    <div
      className="fade"
      style={{
        minHeight:"100vh",
        display:"flex",
        alignItems:"center",
        justifyContent:"center",
        flexDirection:"column",
        padding:20,
        gap:20
      }}
    >

      <div
        style={{
          width:70,
          height:70,
          borderRadius:"50%",
          display:"flex",
          alignItems:"center",
          justifyContent:"center",
          background:"#111827",
          border:"1px solid #26334b"
        }}
      >

        <span
          style={{
            fontSize:30,
            color:"#22d3ee",
            animation:
              "spin 1s linear infinite"
          }}
        >
          ⟳
        </span>

      </div>


      <div
        style={{
          fontSize:16,
          fontWeight:800,
          color:"#f8fafc",
          textAlign:"center"
        }}
      >
        {steps[stepIdx]}
      </div>


      <div
        style={{
          width:240,
          height:6,
          background:"#111827",
          borderRadius:20,
          overflow:"hidden"
        }}
      >

        <div
          style={{
            width:`${progress}%`,
            height:"100%",
            background:
              "linear-gradient(90deg,#3b82f6,#22d3ee)",
            transition:"width .5s ease"
          }}
        />

      </div>


      <div
        style={{
          color:"#56627a",
          fontSize:11
        }}
      >
        يتم إنشاء صفحة مخصصة لهذا المنتج…
      </div>

    </div>
  );
}


/* =========================================================
   PREVIEW
========================================================= */

function PreviewScreen(props){

  const {
    html,
    iframeRef,
    iframeHeight,
    onIframeLoad,
    previewMode,
    setPreviewMode,
    regenNote,
    setRegenNote,
    onRegenerate,
    regenerating,
    canUndo,
    canRedo,
    onUndo,
    onRedo,
    onCopy,
    onDownload,
    onDownloadJPG,
    exportingJPG,
    copyStatus,
    error,
    onBack
  }=props;

  return(

    <div
      style={{
        minHeight:"100vh",
        background:"#05070c"
      }}
    >

      {/* TOP BAR */}

      <div
        className="topActions"
        style={{
          position:"sticky",
          top:0,
          zIndex:50,
          display:"flex",
          alignItems:"center",
          gap:7,
          padding:"9px 12px",
          background:"#0c1321",
          borderBottom:"1px solid #1d2940"
        }}
      >

        <button
          onClick={onBack}
          style={toolBtn}
        >
          ← مشروع جديد
        </button>

        <div style={{flex:1}}/>


        <button
          onClick={onUndo}
          disabled={!canUndo}
          style={{
            ...toolBtn,
            opacity:canUndo?1:.35
          }}
        >
          ↶
        </button>

        <button
          onClick={onRedo}
          disabled={!canRedo}
          style={{
            ...toolBtn,
            opacity:canRedo?1:.35
          }}
        >
          ↷
        </button>


        <div
          style={{
            display:"flex",
            background:"#111827",
            borderRadius:8,
            padding:3,
            gap:2
          }}
        >

          <button
            onClick={()=>
              setPreviewMode("mobile")
            }
            style={{
              ...segBtn,
              background:
                previewMode==="mobile"
                  ? "#22d3ee"
                  : "transparent",
              color:
                previewMode==="mobile"
                  ? "#031019"
                  : "#aab5c7"
            }}
          >
            📱
          </button>

          <button
            onClick={()=>
              setPreviewMode("desktop")
            }
            style={{
              ...segBtn,
              background:
                previewMode==="desktop"
                  ? "#22d3ee"
                  : "transparent",
              color:
                previewMode==="desktop"
                  ? "#031019"
                  : "#aab5c7"
            }}
          >
            🖥
          </button>

        </div>


        <button
          onClick={onCopy}
          style={toolBtn}
        >
          📋 نسخ HTML
        </button>


        <button
          onClick={onDownloadJPG}
          disabled={exportingJPG}
          style={{
            ...toolBtn,
            opacity:
              exportingJPG?.5:1
          }}
        >
          {exportingJPG
            ? "⟳ جاري..."
            : "🖼 تصدير JPG"}
        </button>


        <button
          onClick={onDownload}
          style={{
            ...toolBtn,
            background:"#22d3ee",
            color:"#031019",
            borderColor:"#22d3ee"
          }}
        >
          ⬇ تحميل HTML
        </button>

      </div>


      {/* COPY STATUS */}

      {copyStatus && (

        <div
          style={{
            textAlign:"center",
            background:"#0c1321",
            color:"#6ee7b7",
            padding:"6px",
            fontSize:11
          }}
        >
          {copyStatus}
        </div>

      )}


      {/* REGENERATE */}

      <div
        style={{
          padding:"10px 12px",
          background:"#0c1321",
          borderBottom:"1px solid #1d2940",
          display:"flex",
          gap:7
        }}
      >

        <input
          value={regenNote}
          onChange={e=>
            setRegenNote(e.target.value)
          }
          onKeyDown={e=>{
            if(e.key==="Enter"){
              onRegenerate();
            }
          }}
          disabled={regenerating}
          placeholder="مثال: اجعل التصميم أكثر فخامة، غيّر الألوان، اجعل الصفحة أبسط..."
          style={inputStyle}
        />

        <button
          onClick={onRegenerate}
          disabled={
            regenerating ||
            !regenNote.trim()
          }
          style={{
            ...toolBtn,
            background:"#3b82f6",
            borderColor:"#3b82f6",
            color:"#fff",
            whiteSpace:"nowrap",
            opacity:
              regenerating ||
              !regenNote.trim()
                ? .45
                : 1
          }}
        >
          {regenerating
            ? "⟳ جاري..."
            : "🪄 إعادة التصميم"}
        </button>

      </div>


      {error && (

        <div
          style={{
            background:"#0c1321",
            color:"#f87171",
            textAlign:"center",
            fontSize:11,
            padding:6
          }}
        >
          {error}
        </div>

      )}


      {/* PREVIEW */}

      <div
        style={{
          minHeight:"calc(100vh - 120px)",
          padding:"28px 15px 60px",
          display:"flex",
          justifyContent:"center",
          background:"#05070c"
        }}
      >

        <div
          style={{
            width:
              previewMode==="mobile"
                ? 390
                : "100%",
            maxWidth:
              previewMode==="mobile"
                ? 390
                : 1200,
            height:"fit-content",
            overflow:"hidden",
            background:"#fff",
            borderRadius:
              previewMode==="mobile"
                ? 30
                : 14,
            border:
              previewMode==="mobile"
                ? "8px solid #1a1f2b"
                : "1px solid #202a40",
            boxShadow:
              "0 30px 80px rgba(0,0,0,.55)"
          }}
        >

          <iframe
            ref={iframeRef}
            srcDoc={html}
            onLoad={onIframeLoad}
            title="landing-preview"
            style={{
              width:"100%",
              height:iframeHeight,
              border:0,
              display:"block"
            }}
          />

        </div>

      </div>

    </div>
  );
}


/* =========================================================
   BUTTONS
========================================================= */

const toolBtn={
  display:"flex",
  alignItems:"center",
  gap:5,
  border:"1px solid #27344b",
  borderRadius:8,
  background:"#111827",
  color:"#e2e8f0",
  padding:"8px 11px",
  fontSize:11.5,
  fontWeight:700,
  cursor:"pointer",
  whiteSpace:"nowrap"
};

const segBtn={
  border:0,
  borderRadius:6,
  padding:"6px 9px",
  cursor:"pointer",
  fontSize:12
};


/* =========================================================
   START
========================================================= */

const root=
  ReactDOM.createRoot(
    document.getElementById("root")
  );

root.render(<App/>);

</script>

</body>
</html>
