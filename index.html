function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function dataUrlParts(dataUrl) {
  const m = /^data:(.+?);base64,(.+)$/.exec(dataUrl || "");
  return m ? { mediaType: m[1], base64: m[2] } : null;
}
function formatPrice(value, country) {
  const n = Number(value);
  if (Number.isNaN(n)) return value + " " + country.currency;
  return n.toLocaleString("en-US") + " " + country.currency;
}
function stripToJSON(text) {
  let t = (text || "").trim();
  t = t.replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
  const s = t.indexOf("{"), e = t.lastIndexOf("}");
  if (s !== -1 && e !== -1) t = t.slice(s, e + 1);
  return JSON.parse(t);
}
function validateGeneratedData(data) {
  if (!data || typeof data !== "object") throw new Error("رد غير صالح من محرك الذكاء الاصطناعي.");
  if (!data.hero || !data.hero.headline) throw new Error("الصفحة الناتجة ناقصة (لا يوجد عنوان رئيسي). حاول مرة أخرى.");
  if (!DESIGN_SYSTEMS[data.designSystem]) data.designSystem = "Lifestyle";
  if (!Array.isArray(data.sections)) data.sections = [];
  return data;
}
async function callClaude(content) {
  // يتصل بالـ Backend الخاص بنا (api/generate.js) بدل الاتصال المباشر بـ Anthropic.
  // مفتاح الـ API مخبّأ فالسيرفر (Environment Variable) وما ظاهرش هنا فالفرونت-إند.
  const response = await fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content }),
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "تعذّر الاتصال بمحرك الذكاء الاصطناعي.");
  if (!data.text) throw new Error("لم يصل رد نصي من المحرك");
  return validateGeneratedData(stripToJSON(data.text));
}

  إلكترونيات: features → specs → compare → benefits → testimonials → urgency
  تجميل/عناية: benefits → features → howToUse → testimonials → urgency
  لا تستخدم نفس الترتيب دائماً بلا تفكير؛ اختره بناءً على ما يقنع مشتري هذا المنتج تحديداً.
- اختيار designSystem يجب أن يعكس طبيعة المنتج الحقيقية الظاهرة في الصور، وليس اختياراً افتراضياً متكرراً. دليل الاختيار:
  Tech (أجهزة إلكترونية عامة، سماعات، شواحن) | Beauty (تجميل، عناية بالبشرة) | Health (صحة، مكملات، لياقة) |
  Home (أدوات منزلية، مطبخ) | Fashion (ملابس، إكسسوارات فاخرة) | Kids (منتجات أطفال) | Car (إكسسوارات سيارات) |
  Gadgets (منتجات تقنية غريبة/مبتكرة تحديداً كالألعاب الذكية أو الأدوات الغريبة، وليس أي جهاز إلكتروني عادي) |
  Tools (عدد، أدوات يدوية، مستلزمات مهنية) | Lifestyle (منتجات عامة لا تنتمي بوضوح لفئة أخرى).
  لا تختر Gadgets إلا إذا كان المنتج فعلاً غريباً/مبتكراً بشكل واضح؛ أغلب الأجهزة الإلكترونية العادية تدخل تحت Tech.
- اختر فقط الأقسام المناسبة فعلاً لطبيعة هذا المنتج تحديدا، لا تُدرج قسماً لا داعي له. قسم "compare" أدرجه فقط إن كان للمنتج بديل تقليدي واضح يمكن المقارنة معه بإنصاف (بدون ذكر أسماء علامات تجارية حقيقية في "them").
- اكتب محتوى محدداً بخصائص المنتج الظاهرة في الصور، لا تستخدم عبارات عامة مثل "منتج رائع وعالي الجودة".
- التزم بلهجة الدولة المطلوبة في كل نصوص الأزرار والعناوين المخاطبة للعميل، بشكل طبيعي غير متكلف.
- لا تخترع مراجعات عملاء على أنها حقيقية؛ استخدمها كمحتوى Placeholder واضح عبر حقل note.
- لا تُدرج ادعاءات طبية أو علاجية غير مثبتة إن كان المنتج تجميلياً أو صحياً.
- priceOld و discountPercent اجعلهما فارغين "" إن لم يكن هناك خصم واضح من السياق.
- successHeadline وsuccessText يجب أن يطمئنا العميل بأن الطلب وصل وسيتم التواصل معه قريباً.
`.trim();

function buildGeneratePrompt(form, country) {
  return SCHEMA_INSTRUCTIONS + "\n\nبيانات المنتج:\n- اسم المنتج: " + form.name +
    "\n- السعر الحالي: " + form.price + " " + country.currency +
    "\n- الدولة المستهدفة: " + country.name +
    "\n- اللهجة المطلوبة: " + (form.dialect === "auto" ? country.dialect + " (تلقائي حسب الدولة)" : form.dialect) +
    "\n- وصف من المستخدم (قد يكون فارغاً، إن كان فارغاً استنتج الوصف من الصور): " + (form.description || "(لا يوجد، استنتج من الصور)") +
    "\n\nحلّل الصور المرفقة جيداً (النوع، الشكل، اللون، الاستخدام، الجمهور المحتمل) وابنِ عليها كامل المحتوى.";
}
function buildEditPrompt(currentData, instruction, country) {
  return "أنت تُعدّل صفحة هبوط موجودة بناءً على طلب المستخدم. البيانات الحالية للصفحة بصيغة JSON:\n\n" +
    JSON.stringify(currentData) + "\n\nطلب التعديل من المستخدم: \"" + instruction + "\"\n\nالدولة: " + country.name +
    "، العملة: " + country.currency + ".\n\nعدّل فقط ما يطلبه المستخدم، وأعد كامل كائن JSON بنفس الشكل والحقول بالضبط " +
    "(بما فيها designSystem وsections وhero وseo) بعد تطبيق التعديل، بدون أي نص خارج JSON وبدون Markdown fences.";
}

/* ============================== APP ============================== */

function App() {
  const [step, setStep] = useState("form");
  const [form, setForm] = useState({ name: "", price: "", description: "", countryCode: "SA", dialect: "auto", whatsapp: "" });
  const [images, setImages] = useState([]);
  const [error, setError] = useState("");
  const [genStepIdx, setGenStepIdx] = useState(0);

  const [history, setHistory] = useState([]);
  const [historyIdx, setHistoryIdx] = useState(-1);
  const data = historyIdx >= 0 ? history[historyIdx] : null;

  const [previewMode, setPreviewMode] = useState("mobile");
  const [editCmd, setEditCmd] = useState("");
  const [editing, setEditing] = useState(false);
  const [copyStatus, setCopyStatus] = useState("");

  const country = COUNTRIES.find((c) => c.code === form.countryCode) || COUNTRIES[0];
  const tokens = data && data._paletteVariant ? data._paletteVariant : DESIGN_SYSTEMS.Tech[0];
  const heroLayout = data && data._heroLayout ? data._heroLayout : "split";

  const genTimer = useRef(null);
  useEffect(() => {
    if (step === "loading") {
      setGenStepIdx(0);
      genTimer.current = setInterval(() => setGenStepIdx((i) => (i < GEN_STEPS.length - 1 ? i + 1 : i)), 4500);
    } else if (genTimer.current) clearInterval(genTimer.current);
    return () => genTimer.current && clearInterval(genTimer.current);
  }, [step]);

  async function handleImageUpload(e) {
    const files = Array.from(e.target.files || []).slice(0, 4 - images.length);
    const next = [];
    for (const f of files) {
      try {
        const dataUrl = await fileToDataUrl(f);
        const parts = dataUrlParts(dataUrl);
        if (parts) next.push({ dataUrl, mediaType: parts.mediaType, base64: parts.base64 });
      } catch (e2) {}
    }
    setImages((prev) => [...prev, ...next].slice(0, 4));
    e.target.value = "";
  }
  function removeImage(i) { setImages((prev) => prev.filter((_, idx) => idx !== i)); }

  async function handleGenerate() {
    setError("");
    if (!form.name.trim()) return setError("أدخل اسم المنتج أولاً.");
    if (!form.price) return setError("أدخل سعر المنتج أولاً.");
    if (images.length === 0) return setError("ارفع صورة واحدة على الأقل للمنتج.");
    setStep("loading");
    try {
      const content = [
        { type: "text", text: buildGeneratePrompt(form, country) },
        ...images.map((img) => ({ type: "image", source: { type: "base64", media_type: img.mediaType, data: img.base64 } })),
      ];
      const result = await callClaude(content);
      result._paletteVariant = pickDesignTokens(result.designSystem);
      result._heroLayout = pickHeroLayout();
      setHistory([result]); setHistoryIdx(0); setStep("preview");
    } catch (err) {
      setError(err.message || "حدث خطأ أثناء التوليد، حاول مرة أخرى.");
      setStep("form");
    }
  }

  async function handleApplyEdit() {
    if (!editCmd.trim() || !data) return;
    setEditing(true); setError("");
    try {
      const content = [{ type: "text", text: buildEditPrompt(data, editCmd.trim(), country) }];
      const result = await callClaude(content);
      const designChanged = result.designSystem !== data.designSystem;
      result._paletteVariant = designChanged ? pickDesignTokens(result.designSystem) : data._paletteVariant;
      result._heroLayout = designChanged ? pickHeroLayout() : data._heroLayout;
      const truncated = history.slice(0, historyIdx + 1);
      const nextHistory = [...truncated, result];
      setHistory(nextHistory); setHistoryIdx(nextHistory.length - 1); setEditCmd("");
    } catch (err) {
      setError(err.message || "تعذّر تنفيذ التعديل.");
    } finally { setEditing(false); }
  }

  function undo() { if (historyIdx > 0) setHistoryIdx(historyIdx - 1); }
  function redo() { if (historyIdx < history.length - 1) setHistoryIdx(historyIdx + 1); }

  // ولّد تصميم مختلف: نفس المحتوى بالضبط، لكن نظام تصميم + تخطيط Hero + تنويعة ألوان جديدة، بلا استدعاء API (فوري)
  function handleShuffleDesign() {
    if (!data) return;
    const allSystems = Object.keys(DESIGN_SYSTEMS);
    const otherSystems = allSystems.filter((s) => s !== data.designSystem);
    const nextSystem = otherSystems[Math.floor(Math.random() * otherSystems.length)] || data.designSystem;
    const next = Object.assign({}, data, {
      designSystem: nextSystem,
      _paletteVariant: pickDesignTokens(nextSystem),
      _heroLayout: pickHeroLayout(),
    });
    const truncated = history.slice(0, historyIdx + 1);
    const nextHistory = [...truncated, next];
    setHistory(nextHistory); setHistoryIdx(nextHistory.length - 1);
  }

  const htmlString = data ? buildStandaloneHTML(data, tokens, images, form, country) : "";

  async function copyHTML() {
    try { await navigator.clipboard.writeText(htmlString); setCopyStatus("تم نسخ الكود ✓"); }
    catch { setCopyStatus("تعذّر النسخ التلقائي، استخدم زر التحميل"); }
    setTimeout(() => setCopyStatus(""), 2500);
  }
  function downloadHTML() {
    const blob = new Blob([htmlString], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = (form.name || "landing-page").trim().replace(/\s+/g, "-") + ".html";
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }

  return (
    <div dir="rtl" style={{ fontFamily: "'Cairo', sans-serif", minHeight: "100vh", background: "#0B0F19" }}>
      {step === "form" && <FormScreen form={form} setForm={setForm} images={images} onUpload={handleImageUpload} onRemoveImage={removeImage} error={error} onGenerate={handleGenerate} />}
      {step === "loading" && <LoadingScreen stepIdx={genStepIdx} />}
      {step === "preview" && data && (
        <PreviewScreen data={data} tokens={tokens} images={images} form={form} country={country}
          previewMode={previewMode} setPreviewMode={setPreviewMode}
          editCmd={editCmd} setEditCmd={setEditCmd} onApplyEdit={handleApplyEdit} editing={editing}
          canUndo={historyIdx > 0} canRedo={historyIdx < history.length - 1} onUndo={undo} onRedo={redo}
          onCopy={copyHTML} onDownload={downloadHTML} copyStatus={copyStatus} error={error}
          onShuffleDesign={handleShuffleDesign}
          onBack={() => setStep("form")} />
      )}
    </div>
  );
}

          <Ico size={14}>✨</Ico> Arabic Landing AI
        </div>
        <h1 style={{ color: "#F1F5F9", fontSize: 30, fontWeight: 800, lineHeight: 1.4, margin: 0 }}>أنشئ صفحة هبوط احترافية لمنتجك بالذكاء الاصطناعي</h1>
        <p style={{ color: "#8B96AC", fontSize: 15, marginTop: 10 }}>منتج + سعر + صور + دولة = صفحة هبوط جاهزة</p>
      </div>
      <div className="glass" style={{ borderRadius: 20, padding: 22, display: "grid", gap: 16, position: "relative", boxShadow: "0 30px 70px rgba(0,0,0,.45)" }}>
        <Field label="اسم المنتج"><input value={form.name} onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))} placeholder="مثال: سماعة بلوتوث لاسلكية" style={inputStyle} /></Field>
        <Field label="سعر المنتج"><input type="number" value={form.price} onChange={(e) => setForm((f) => ({ ...f, price: e.target.value }))} placeholder="مثال: 149" style={inputStyle} /></Field>
        <Field label="صور المنتج (حتى 4 صور)">
          <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
            {images.map((img, i) => (
              <div key={i} style={{ position: "relative", width: 76, height: 76, borderRadius: 12, overflow: "hidden", border: "1px solid #202A42" }}>

                <button onClick={() => onRemoveImage(i)} style={{ position: "absolute", top: 3, left: 3, background: "rgba(0,0,0,.6)", border: "none", borderRadius: 6, color: "#fff", padding: 2, cursor: "pointer", display: "flex" }}><Ico size={12}>✕</Ico></button>
              </div>
            ))}
            {images.length < 4 && (
              <label style={{ width: 76, height: 76, borderRadius: 12, border: "1.5px dashed #2A3654", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", cursor: "pointer", color: "#5B6478", gap: 4 }}>
                <Ico size={18}>🖼️</Ico><span style={{ fontSize: 10 }}>رفع</span>
                <input type="file" accept="image/*" multiple onChange={onUpload} style={{ display: "none" }} />
              </label>
            )}
          </div>
        </Field>
        <Field label="وصف المنتج (اختياري)"><textarea value={form.description} onChange={(e) => setForm((f) => ({ ...f, description: e.target.value }))} placeholder="اتركه فارغاً وسيقوم الذكاء الاصطناعي بكتابة وصف من الصور" rows={3} style={Object.assign({}, inputStyle, { resize: "vertical" })} /></Field>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <Field label="الدولة المستهدفة"><select value={form.countryCode} onChange={(e) => setForm((f) => ({ ...f, countryCode: e.target.value }))} style={inputStyle}>{COUNTRIES.map((c) => <option key={c.code} value={c.code}>{c.name}</option>)}</select></Field>
          <Field label="اللهجة"><select value={form.dialect} onChange={(e) => setForm((f) => ({ ...f, dialect: e.target.value }))} style={inputStyle}><option value="auto">تلقائي حسب الدولة</option>{COUNTRIES.map((c) => <option key={c.code} value={c.dialect}>{c.dialect}</option>)}</select></Field>

function Field({ label, children }) { return <label style={{ display: "grid", gap: 6 }}><span style={{ color: "#B7C0D4", fontSize: 13, fontWeight: 600 }}>{label}</span>{children}</label>; }
const inputStyle = { background: "#0E1526", border: "1px solid #202A42", borderRadius: 10, color: "#F1F5F9", padding: "11px 13px", fontSize: 14.5, outline: "none", width: "100%" };

function LoadingScreen({ stepIdx }) {
  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 22, padding: 20, position: "relative", overflow: "hidden" }} className="fade-in">
      <div className="orb" style={{ width: 240, height: 240, top: "20%", right: -50, background: "#2563eb55", animation: "drift 7s ease-in-out infinite" }} />

        <Ico size={28} color="#22D3EE" style={{ animation: "spin 1s linear infinite" }}>⟳</Ico>
      </div>
      <div style={{ color: "#F1F5F9", fontWeight: 700, fontSize: 16, textAlign: "center", maxWidth: 280 }}>{GEN_STEPS[stepIdx]}</div>
      <div style={{ width: 220, height: 6, borderRadius: 4, overflow: "hidden", background: "#131A2A" }}>
        <div className="shimmer" style={{ width: ((stepIdx + 1) / GEN_STEPS.length) * 100 + "%", height: "100%", background: "linear-gradient(90deg,#3B82F6,#22D3EE)", transition: "width .5s ease" }} />
      </div>
      <p style={{ color: "#5c6b85", fontSize: 11 }}>قد يستغرق هذا حتى دقيقة كاملة للحصول على أفضل نتيجة، لا تغلق الصفحة</p>
    </div>
  );
}

function PreviewScreen(props) {
  const { data, tokens, images, form, country, previewMode, setPreviewMode, editCmd, setEditCmd, onApplyEdit, editing, canUndo, canRedo, onUndo, onRedo, onCopy, onDownload, copyStatus, error, onBack, onShuffleDesign } = props;
  const captureRef = useRef(null);
  const [jpgLoading, setJpgLoading] = useState(false);
  async function exportJPG() {
    if (!captureRef.current || !window.html2canvas) return;
    setJpgLoading(true);
    try {
      const canvas = await window.html2canvas(captureRef.current, { scale: 2, backgroundColor: tokens.bg, useCORS: true });
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/jpeg", 0.95);
      a.download = (form.name || "landing-page").trim().replace(/\s+/g, "-") + ".jpg";
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { /* silent */ }
    setJpgLoading(false);
  }
  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
      <div style={{ position: "sticky", top: 0, zIndex: 20, background: "#0E1526", borderBottom: "1px solid #1D2740", padding: "10px 16px", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <button onClick={onBack} style={toolBtn}>← مشروع جديد</button>
        <button onClick={onShuffleDesign} style={Object.assign({}, toolBtn, { background: "#7C3AED", color: "#fff", borderColor: "#7C3AED" })}><Ico size={14}>🎲</Ico> ولّد تصميم مختلف</button>
        <div style={{ flex: 1 }} />
        <button onClick={onUndo} disabled={!canUndo} style={Object.assign({}, toolBtn, { opacity: canUndo ? 1 : 0.4 })}><Ico size={14}>↶</Ico></button>
        <button onClick={onRedo} disabled={!canRedo} style={Object.assign({}, toolBtn, { opacity: canRedo ? 1 : 0.4 })}><Ico size={14}>↷</Ico></button>
        <div style={{ display: "flex", background: "#131A2A", borderRadius: 8, padding: 3, gap: 2 }}>
          <button onClick={() => setPreviewMode("mobile")} style={Object.assign({}, segBtn, { background: previewMode === "mobile" ? "#22D3EE" : "transparent", color: previewMode === "mobile" ? "#04101C" : "#B7C0D4" })}><Ico size={14}>📱</Ico></button>
          <button onClick={() => setPreviewMode("desktop")} style={Object.assign({}, segBtn, { background: previewMode === "desktop" ? "#22D3EE" : "transparent", color: previewMode === "desktop" ? "#04101C" : "#B7C0D4" })}><Ico size={14}>🖥️</Ico></button>
        </div>
        <button onClick={onCopy} style={toolBtn}><Ico size={14}>📋</Ico> نسخ HTML</button>
        <button onClick={exportJPG} disabled={jpgLoading} style={Object.assign({}, toolBtn, { opacity: jpgLoading ? 0.6 : 1 })}><Ico size={14}>🖼️</Ico> {jpgLoading ? "..." : "تحميل JPG"}</button>
        <button onClick={onDownload} style={Object.assign({}, toolBtn, { background: "#22D3EE", color: "#04101C", borderColor: "#22D3EE" })}><Ico size={14}>⬇️</Ico> تحميل HTML</button>
      </div>
      {copyStatus && <div style={{ textAlign: "center", color: "#6EE7B7", fontSize: 12, padding: "6px 0", background: "#0E1526" }}>{copyStatus}</div>}
      <div style={{ background: "#0E1526", borderBottom: "1px solid #1D2740", padding: "10px 16px", display: "flex", gap: 8 }}>
        <div style={{ flex: 1, position: "relative" }}>
          <span style={{ position: "absolute", top: "50%", right: 12, transform: "translateY(-50%)" }}><Ico size={15} color="#5B6478">🪄</Ico></span>
          <input value={editCmd} onChange={(e) => setEditCmd(e.target.value)} onKeyDown={(e) => e.key === "Enter" && onApplyEdit()} placeholder='مثال: "غيّر العنوان ليكون أكثر إقناعاً" أو "احذف آراء العملاء"' style={Object.assign({}, inputStyle, { paddingRight: 34 })} disabled={editing} />
        </div>
        <button onClick={onApplyEdit} disabled={editing || !editCmd.trim()} style={Object.assign({}, toolBtn, { background: "#3B82F6", color: "#fff", borderColor: "#3B82F6", opacity: editing || !editCmd.trim() ? 0.5 : 1 })}>
          <Ico size={14} style={editing ? { animation: "spin 1s linear infinite" } : {}}>{editing ? "⟳" : "➤"}</Ico>
        </button>
      </div>
      {error && <div style={{ color: "#F87171", fontSize: 12, textAlign: "center", padding: "6px 0", background: "#0E1526" }}>{error}</div>}
      <div style={{ flex: 1, background: "#05070C", padding: "28px 16px", display: "flex", justifyContent: "center" }}>

          <LandingPage data={data} tokens={tokens} images={images} form={form} country={country} />
        </div>
      </div>
    </div>
  );
}
const toolBtn = { display: "flex", alignItems: "center", gap: 6, background: "#131A2A", border: "1px solid #202A42", color: "#E2E8F5", fontSize: 12.5, fontWeight: 600, padding: "8px 12px", borderRadius: 8, cursor: "pointer" };

/* ============================== LANDING PAGE RENDER (live preview) ============================== */

function LandingPage({ data, tokens, images, form, country }) {

  const [orderState, setOrderState] = useState({ name: "", phone: "", city: "", address: "" });
  const [orderSent, setOrderSent] = useState(false);
  const [toast, setToast] = useState(null);
  const [exitShown, setExitShown] = useState(false);

  // عداد محفوظ فـ localStorage — لا يعيد نفسه عند تحديث الصفحة
  const [secondsLeft, setSecondsLeft] = useState(0);
  useEffect(() => {
    const key = "deadline_" + (form.name || "p").replace(/[^a-zA-Z0-9]/g, "").slice(0, 24);
    let deadline = localStorage.getItem(key);
    if (!deadline || new Date(deadline) < new Date()) {
      deadline = new Date(Date.now() + 1000 * 60 * 60 * 36).toISOString();
      localStorage.setItem(key, deadline);
    }
    const tick = () => setSecondsLeft(Math.max(0, Math.round((new Date(deadline) - new Date()) / 1000)));
    tick();
    const t = setInterval(tick, 1000);
    return () => clearInterval(t);
  }, [form.name]);
  const hh = String(Math.floor(secondsLeft / 3600)).padStart(2, "0");
  const mm = String(Math.floor((secondsLeft % 3600) / 60)).padStart(2, "0");
  const ss = String(secondsLeft % 60).padStart(2, "0");

  // إشعار طلبات حية
  useEffect(() => {
    const pool = socialProofPool(form.countryCode);
    function show() {
      const r = pool[Math.floor(Math.random() * pool.length)];
      setToast(r[0] + " من " + r[1] + " طلب المنتج للتو");
      setTimeout(() => setToast(null), 4500);
    }
    const t1 = setTimeout(show, 4000);
    const t2 = setInterval(show, 15000);
    return () => { clearTimeout(t1); clearInterval(t2); };
  }, [form.countryCode]);

  const hasContact = !!form.whatsapp;
  const waLink = hasContact ? "https://wa.me/" + country.phoneCode.replace("+", "") + form.whatsapp : "";
  const callLink = hasContact ? "tel:" + country.phoneCode + form.whatsapp : "";

  // بقية الصور (غير صورة الهيرو) تتوزع على طول الصفحة بدل ما تتجمع فبلاصة وحدة
  const secondaryImages = images.slice(1);
  function SectionImage({ idx }) {
    const img = secondaryImages[idx];
    if (!img) return null;
    return (
      <div style={{ padding: "4px 20px 24px" }}>
        <img src={img.dataUrl} alt={form.name} style={{ width: "100%", maxHeight: 260, objectFit: "cover", borderRadius: tokens.radius, display: "block" }} />
      </div>
    );
  }

  return (
    <div dir="rtl" style={{ background: tokens.bg, color: tokens.text, fontFamily: "'Cairo', sans-serif", position: "relative" }}>
      <div style={{ position: "sticky", top: 0, zIndex: 30, background: "linear-gradient(90deg," + tokens.primaryDeep + "," + tokens.primary + ")", color: "#fff", textAlign: "center", fontWeight: 700, fontSize: 11, padding: "7px 8px", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
        <span style={{ width: 7, height: 7, borderRadius: "50%", background: "#fff", animation: "pulseDot 1.4s ease-in-out infinite" }} />
        العرض ينتهي خلال {hh}:{mm}:{ss}
      </div>

      {heroLayout === "fullbleed" && images.length > 0 ? (
        <section style={{ position: "relative" }}>
          <img src={images[0].dataUrl} alt={form.name} style={{ width: "100%", height: 340, objectFit: "cover", display: "block" }} />
          <div style={{ position: "absolute", inset: 0, background: "linear-gradient(to top," + tokens.bg + " 15%, transparent 60%)" }} />
          <div style={{ position: "relative", padding: "0 20px 20px", marginTop: -70 }}>
            {data.hero && data.hero.eyebrow && <span style={Object.assign({ display: "inline-block", fontSize: 12, fontWeight: 700, color: tokens.accent, background: tokens.surface, padding: "4px 12px", marginBottom: 12 }, badgeExtra)}>{data.hero.eyebrow}</span>}
            <h1 style={{ fontFamily: "'" + dna.heading + "', sans-serif", fontSize: 24, fontWeight: 900, marginBottom: 8, color: tokens.text }}>{data.hero && data.hero.headline}</h1>
            <p style={{ fontSize: 14, color: tokens.muted, marginBottom: 14 }}>{data.hero && data.hero.subheadline}</p>
            <div style={{ background: tokens.card, borderRadius: tokens.radius, padding: 14, marginBottom: 14 }}>

              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>{(data.hero && data.hero.badges || []).map((b, i) => <span key={i} style={{ fontSize: 11, fontWeight: 600, color: tokens.muted }}>✓ {b}</span>)}</div>

            <span style={{ fontSize: 26, fontWeight: 900, color: tokens.primary }}>{formatPrice(form.price, country)}</span>

            {data.hero && data.hero.discountPercent && <span style={{ fontSize: 12, fontWeight: 800, color: "#fff", background: "#E63946", padding: "3px 9px", borderRadius: 999 }}>خصم {data.hero.discountPercent}%</span>}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", gap: 8, marginBottom: 18 }}>
            {(data.hero && data.hero.badges || []).map((b, i) => <span key={i} style={{ fontSize: 11.5, fontWeight: 600, color: tokens.muted, background: tokens.surface, padding: "5px 10px", borderRadius: 999 }}>{b}</span>)}

            {data.hero && data.hero.discountPercent && <span style={{ fontSize: 12, fontWeight: 800, color: "#fff", background: "#E63946", padding: "3px 9px", borderRadius: 999 }}>خصم {data.hero.discountPercent}%</span>}

          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 18 }}>

          </div>

              <div key={i} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>

              <div key={i} style={{ background: tokens.card, borderRadius: tokens.radius, padding: 14, textAlign: "center" }}>

      {sections.includes("specs") && data.specs && (
        <Section title={data.specs.title} tokens={tokens}>
          <div style={{ background: tokens.card, borderRadius: tokens.radius, overflow: "hidden" }}>
            {(data.specs.items || []).map((it, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "10px 14px", borderBottom: i < data.specs.items.length - 1 ? "1px solid " + tokens.bg : "none", fontSize: 12.5 }}>
                <span style={{ color: tokens.muted }}>{it.label}</span><span style={{ fontWeight: 700 }}>{it.value}</span>
              </div>
            ))}
          </div>
        </Section>
      )}

      {sections.includes("compare") && data.compare && (
        <Section title={data.compare.title} tokens={tokens}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <div style={{ background: tokens.bg, border: "1px solid " + tokens.muted + "33", borderRadius: tokens.radius, padding: 12 }}>
              <div style={{ fontWeight: 800, fontSize: 12, marginBottom: 8, color: tokens.muted }}>✗ الطريقة التقليدية</div>
              <div style={{ display: "grid", gap: 6 }}>{(data.compare.them || []).map((t, i) => <div key={i} style={{ fontSize: 11.5, color: tokens.muted }}>✗ {t}</div>)}</div>
            </div>
            <div style={{ background: tokens.card, border: "1px solid " + tokens.primary, borderRadius: tokens.radius, padding: 12 }}>
              <div style={{ fontWeight: 800, fontSize: 12, marginBottom: 8 }}>✓ {data.compare.productLabel || form.name}</div>

        <Section title={data.testimonials.title} tokens={tokens} note={data.testimonials.note}>
          <div style={{ display: "grid", gap: 10 }}>
            {(data.testimonials.items || []).map((it, i) => (
              <div key={i} style={{ background: tokens.card, borderRadius: tokens.radius, padding: 14 }}>

}
function orderInputStyle(tokens) { return { width: "100%", background: tokens.bg, border: "1px solid " + tokens.muted + "44", borderRadius: 8, padding: "11px 12px", color: tokens.text, fontSize: 13, fontFamily: "inherit" }; }

function Section({ title, tokens, note, children }) {
  return (
    <section style={{ padding: "10px 20px 24px" }}>
      {title && <h2 style={{ fontSize: 17, fontWeight: 800, margin: "0 0 4px" }}>{title}</h2>}
      {note && <p style={{ fontSize: 10.5, color: tokens.muted, margin: "0 0 12px" }}>{note}</p>}
      <div style={{ marginTop: note ? 0 : 12 }}>{children}</div>
    </section>
  );
}
function FaqItem({ q, a, tokens }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ background: tokens.card, borderRadius: tokens.radius, overflow: "hidden" }}>
      <button onClick={() => setOpen((o) => !o)} style={{ width: "100%", background: "none", border: "none", padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", color: tokens.text, fontFamily: "inherit" }}>
        <span style={{ fontSize: 13, fontWeight: 700, textAlign: "right" }}>{q}</span>
        <Ico size={16} color={tokens.muted} style={{ transform: open ? "rotate(180deg)" : "none", transition: "transform .2s", flexShrink: 0 }}>▾</Ico>
      </button>
      {open && <div style={{ padding: "0 14px 14px", fontSize: 12.5, color: tokens.muted, lineHeight: 1.7 }}>{a}</div>}
    </div>
  );
}

/* هذا الملف هو ما يُنزَّله المستخدم فعلياً — يجب أن يطابق المعاينة الحية بكل ميزاتها التفاعلية */

function buildStandaloneHTML(data, tokens, images, form, country) {
  const esc = (s) => String(s == null ? "" : s).replace(/</g, "&lt;");
  const sections = data.sections || [];
  const dna = styleDNA(data.designSystem);
  const btnRadius = buttonRadius(dna.button, tokens.radius);
  const btnShadow = ctaShadow(dna.shadow, tokens.primary);
  const badgeCss = dna.badge === "outline" ? "background:transparent;border:1.5px solid var(--primary);color:var(--primary);" : dna.badge === "ribbon" ? "border-radius:4px 4px 4px 0;" : "border-radius:999px;";
  const hasContact = !!form.whatsapp;
  const waNumber = hasContact ? country.phoneCode.replace("+", "") + form.whatsapp : "";
  const pool = socialProofPool(form.countryCode);

  const heroImg = images[0] ? images[0].dataUrl : "";
  const heroGalleryHtml = heroImg ? '<img id="mainImg" src="' + heroImg + '" alt="' + esc(form.name) + '" />' : "";

  // بقية الصور تتوزع على طول الصفحة بدل ما تتجمع فبلاصة وحدة
  const secondaryImages = images.slice(1).map((im) => im.dataUrl);
  const sectionImg = (idx) => secondaryImages[idx] ? '<div class="sec-img"><img src="' + secondaryImages[idx] + '" alt="' + esc(form.name) + '" /></div>' : "";

  const heroLayout = data._heroLayout || "split";

  const badgesHtml = (data.hero && data.hero.badges || []).map((b) => '<span class="badge">' + esc(b) + '</span>').join("");
  const priceBlock = '<div class="price-row"><span class="price">' + esc(formatPrice(form.price, country)) + '</span>' +
    (data.hero && data.hero.priceOld ? '<span class="old">' + esc(formatPrice(data.hero.priceOld, country)) + '</span>' : "") +
    (data.hero && data.hero.discountPercent ? '<span class="discount">خصم ' + esc(data.hero.discountPercent) + '%</span>' : "") + '</div>';
  const eyebrowHtml = data.hero && data.hero.eyebrow ? '<span class="eyebrow">' + esc(data.hero.eyebrow) + '</span>' : "";
  const headlineHtml = '<h1>' + esc(data.hero && data.hero.headline) + '</h1><p class="sub">' + esc(data.hero && data.hero.subheadline) + '</p>';
  const ctaHtml = '<a class="cta" href="#order">' + ctaText + '</a>';
  let heroHtml;
  if (heroLayout === "fullbleed" && heroImg) {
    heroHtml = '<section class="hero hero-fullbleed">' +
      '<img class="hero-bleed-img" src="' + heroImg + '" alt="' + esc(form.name) + '" />' +
      '<div class="hero-bleed-fade"></div>' +

      '<div class="card">' + priceBlock + '<div class="badges">' + badgesHtml + '</div></div>' + ctaHtml + '</div></section>';
  } else if (heroLayout === "centered") {
    heroHtml = '<section class="hero hero-centered">' + eyebrowHtml + headlineHtml +
      (heroImg ? '<div class="hero-circle"><img src="' + heroImg + '" alt="' + esc(form.name) + '" /></div>' : "") +
      priceBlock + '<div class="badges center">' + badgesHtml + '</div>' + ctaHtml + '</section>';
  } else {
    heroHtml = '<section class="hero">' + eyebrowHtml + headlineHtml + heroGalleryHtml + priceBlock + '<div class="badges">' + badgesHtml + '</div>' + ctaHtml + '</section>';
  }

  const urgencyHtml = sections.includes("urgency") && data.urgency ? '<section class="sec"><div class="card row spread"><span class="bold">' + esc(data.urgency.stockLabel) + '</span><span class="accent">' + esc(data.urgency.countdownLabel) + '</span></div></section>' : "";
  const featuresHtml = (sections.includes("features") && data.features ? '<section class="sec"><h2>' + esc(data.features.title) + '</h2><div class="grid1">' + (data.features.items || []).map((it) => '<div class="card row"><div><div class="t">' + esc(it.title) + '</div><div class="d">' + esc(it.desc) + '</div></div></div>').join("") + '</div></section>' : "") + sectionImg(0);
  const benefitsHtml = sections.includes("benefits") && data.benefits ? '<section class="sec"><h2>' + esc(data.benefits.title) + '</h2><div class="grid2">' + (data.benefits.items || []).map((it) => '<div class="card center"><div class="t">' + esc(it.title) + '</div><div class="d">' + esc(it.desc) + '</div></div>').join("") + '</div></section>' : "";
  const howToHtml = (sections.includes("howToUse") && data.howToUse ? '<section class="sec"><h2>' + esc(data.howToUse.title) + '</h2>' + (data.howToUse.steps || []).map((s, i) => '<div class="step"><span class="num">' + (i + 1) + '</span><span>' + esc(s) + '</span></div>').join("") + '</section>' : "") + sectionImg(1);
  const specsHtml = sections.includes("specs") && data.specs ? '<section class="sec"><h2>' + esc(data.specs.title) + '</h2><div class="card">' + (data.specs.items || []).map((it) => '<div class="spec-row"><span class="muted">' + esc(it.label) + '</span><span class="bold">' + esc(it.value) + '</span></div>').join("") + '</div></section>' : "";
  const compareHtml = (sections.includes("compare") && data.compare ? '<section class="sec"><h2>' + esc(data.compare.title) + '</h2><div class="grid2 compare"><div class="card compare-bad"><div class="ct">✗ الطريقة التقليدية</div>' + (data.compare.them || []).map((t) => '<div class="ci muted">✗ ' + esc(t) + '</div>').join("") + '</div><div class="card compare-good"><div class="ct">✓ ' + esc(data.compare.productLabel || form.name) + '</div>' + (data.compare.us || []).map((t) => '<div class="ci">✓ ' + esc(t) + '</div>').join("") + '</div></div></section>' : "") + sectionImg(2);
  const testimonialsHtml = sections.includes("testimonials") && data.testimonials ? '<section class="sec"><h2>' + esc(data.testimonials.title) + '</h2><p class="note">' + esc(data.testimonials.note) + '</p>' + (data.testimonials.items || []).map((it) => '<div class="card"><div class="d">' + esc(it.text) + '</div><div class="name">' + esc(it.name) + '</div></div>').join("") + '</section>' : "";
  const faqHtml = sections.includes("faq") && data.faq ? '<section class="sec"><h2>' + esc(data.faq.title) + '</h2>' + (data.faq.items || []).map((it) => '<details class="card"><summary>' + esc(it.q) + '</summary><p class="d">' + esc(it.a) + '</p></details>').join("") + '</section>' : "";
  const successHeadline = esc((data.orderForm && data.orderForm.successHeadline) || "تم استلام طلبك بنجاح!");

    '</div>' : "";

  return '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />' +
    '<title>' + esc((data.seo && data.seo.title) || form.name) + '</title>' +
    '<meta name="description" content="' + esc((data.seo && data.seo.description) || "") + '" />' +
    '<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;700;800&family=Alexandria:wght@400;500;600;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">' +
    '<style>:root{--bg:' + tokens.bg + ';--surface:' + tokens.surface + ';--card:' + tokens.card + ';--primary:' + tokens.primary + ';--primary-deep:' + tokens.primaryDeep + ';--accent:' + tokens.accent + ';--accent2:' + tokens.accent2 + ';--text:' + tokens.text + ';--muted:' + tokens.muted + ';--radius:' + tokens.radius + ';}' +
    '*{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}body{background:var(--bg);color:var(--text);font-family:"' + dna.body + '",sans-serif;line-height:1.5;padding-top:32px;}.wrap{max-width:480px;margin:0 auto;}.hero{padding:28px 20px 24px;}' +
    '.skip-link{position:absolute;right:-9999px;background:#fff;color:#000;padding:10px 16px;border-radius:10px;z-index:500;}.skip-link:focus{right:14px;top:40px;}' +
    'a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}' +
    '.scarcity{position:fixed;top:0;left:0;right:0;z-index:300;background:linear-gradient(90deg,var(--primary-deep),var(--primary));color:#fff;text-align:center;font-weight:700;font-size:11.5px;padding:8px;display:flex;align-items:center;justify-content:center;gap:6px;}' +
    '.scarcity .dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:pd 1.4s ease-in-out infinite;}@keyframes pd{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(1.5);}}' +
    '.eyebrow{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--surface);padding:4px 12px;margin-bottom:12px;' + badgeCss + '}h1{font-family:"' + dna.heading + '",sans-serif;font-size:25px;font-weight:900;margin-bottom:10px;}' +
    '.hero-fullbleed{padding:0;position:relative;}.hero-bleed-img{width:100%;height:320px;object-fit:cover;display:block;}.hero-bleed-fade{position:absolute;top:0;left:0;right:0;height:320px;background:linear-gradient(to top,var(--bg) 15%,transparent 60%);}' +
    '.hero-bleed-content{position:relative;padding:0 20px 20px;margin-top:-70px;}.hero-bleed-content .card{padding:14px;margin-bottom:14px;}' +
    '.hero-centered{text-align:center;}.hero-centered .sub{max-width:300px;margin:0 auto 20px;}.hero-centered .badges{justify-content:center;}.hero-centered .cta{display:inline-block;padding:15px 40px;}' +
    '.hero-circle{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,' + tokens.primary + '33,transparent 70%);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}' +
    '.hero-circle img{width:190px;height:190px;object-fit:cover;border-radius:50%;border:4px solid var(--surface);}' +
    '.sub{font-size:14.5px;color:var(--muted);margin-bottom:18px;}.hero img#mainImg{width:100%;border-radius:var(--radius);margin-bottom:8px;display:block;max-height:320px;object-fit:cover;}' +
    '.sec-img{padding:0 20px 24px;}.sec-img img{width:100%;max-height:260px;object-fit:cover;border-radius:var(--radius);display:block;}' +
    '.price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;}.price{font-size:26px;font-weight:900;color:var(--primary);}.old{font-size:15px;color:var(--muted);text-decoration:line-through;}' +
    '.discount{font-size:12px;font-weight:800;color:#fff;background:#E63946;padding:3px 9px;border-radius:999px;}.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}' +
    '.badge{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface);padding:5px 10px;border-radius:999px;}.cta{display:block;text-align:center;background:var(--primary);color:' + (tokens.mood === "dark" ? tokens.bg : "#fff") + ';font-weight:800;font-size:15.5px;padding:15px;border-radius:' + btnRadius + ';box-shadow:' + btnShadow + ';text-decoration:none;font-family:"' + dna.heading + '",sans-serif;}' +
    '.sec{padding:10px 20px 24px;}.sec h2{font-size:17px;font-weight:800;margin-bottom:12px;}.grid1{display:grid;gap:12px;}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}' +
    '.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;}.row{display:flex;gap:12px;}.spread{display:flex;justify-content:space-between;align-items:center;}.center{text-align:center;}' +
    '.compare-bad{background:var(--bg);border:1px solid rgba(140,140,140,.3);}.compare-good{border:1px solid var(--primary);}.ct{font-weight:800;font-size:12px;margin-bottom:8px;}.ci{font-size:11.5px;margin-bottom:6px;}' +
    '.t{font-weight:700;font-size:14px;}.d{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.7;}.step{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}' +

    '.spec-row{display:flex;justify-content:space-between;padding:8px 0;font-size:12.5px;border-bottom:1px solid var(--bg);}.bold{font-weight:700;}.muted{color:var(--muted);}.accent{color:var(--accent);font-weight:800;}' +
    '.note{font-size:10.5px;color:var(--muted);margin-bottom:12px;}.name{font-size:11px;color:var(--muted);margin-top:6px;font-weight:700;}summary{cursor:pointer;font-size:13px;font-weight:700;}' +
    '.order{padding:24px 20px;}.order .card input{width:100%;background:var(--bg);border:1px solid rgba(140,140,140,.3);border-radius:8px;padding:11px 12px;color:var(--text);font-size:13px;margin-bottom:10px;font-family:inherit;}' +
    '.order button{width:100%;background:var(--primary);color:' + (tokens.mood === "dark" ? tokens.bg : "#fff") + ';font-weight:800;font-size:15px;padding:14px;border-radius:var(--radius);border:none;cursor:pointer;font-family:inherit;}' +
    '.order-success{display:none;text-align:center;padding:10px 0;}.order-success.show{display:block;}.order-success .emoji{font-size:32px;}' +

    '.sticky a{background:var(--primary);color:' + (tokens.mood === "dark" ? tokens.bg : "#fff") + ';font-weight:800;font-size:13px;padding:10px 20px;border-radius:999px;text-decoration:none;}' +
    '.floating-btns{position:fixed;bottom:76px;left:14px;display:flex;flex-direction:column;gap:10px;z-index:250;}.fab{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none;box-shadow:0 10px 24px rgba(0,0,0,.4);}' +
    '.fab.wa{background:linear-gradient(135deg,#2FE070,#1DAA53);}.fab.call{background:linear-gradient(135deg,var(--primary),var(--primary-deep));}' +

    '.exit-close{position:absolute;top:10px;left:10px;width:28px;height:28px;border-radius:50%;background:rgba(140,140,140,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:900;}' +
    '.exit-price{font-size:24px;font-weight:900;color:var(--accent);margin:12px 0;}</style></head><body>' +
    '<a href="#order" class="skip-link">انتقل إلى نموذج الطلب</a>' +
    '<div class="scarcity"><span class="dot"></span><span>العرض ينتهي خلال <span id="cd">36:00:00</span></span></div>' +

    '<button type="button" onclick="submitOrder()">' + esc((data.orderForm && data.orderForm.buttonText) || "اطلب الآن") + '</button></div>' +

    '</div></section>' +
    (data.finalCta ? '<section class="final"><h3>' + esc(data.finalCta.headline) + '</h3><a href="#order">' + esc(data.finalCta.buttonText) + '</a></section>' : "") +
    '<div class="sticky"><span class="price">' + esc(formatPrice(form.price, country)) + '</span><a href="#order">' + ctaText + '</a></div></div>' +

    '<script>' +
    '(function(){var KEY="deadline_' + (form.name || "p").replace(/[^a-zA-Z0-9]/g, "").slice(0, 24) + '";var d=localStorage.getItem(KEY);if(!d||new Date(d)<new Date()){d=new Date(Date.now()+1000*60*60*36).toISOString();localStorage.setItem(KEY,d);}function tick(){var diff=Math.max(0,new Date(d)-new Date());var h=String(Math.floor(diff/3600000)).padStart(2,"0");var m=String(Math.floor((diff%3600000)/60000)).padStart(2,"0");var s=String(Math.floor((diff%60000)/1000)).padStart(2,"0");var el=document.getElementById("cd");if(el)el.textContent=h+":"+m+":"+s;}tick();setInterval(tick,1000);})();' +
    '(function(){var names=' + JSON.stringify(pool) + ';var toast=document.getElementById("toast");var tx=document.getElementById("toastTx");function show(){var r=names[Math.floor(Math.random()*names.length)];tx.textContent=r[0]+" من "+r[1]+" طلب المنتج للتو";toast.classList.add("show");setTimeout(function(){toast.classList.remove("show");},4500);}setTimeout(show,4000);setInterval(show,15000);})();' +
    '(function(){var ov=document.getElementById("exitOv");var shown=sessionStorage.getItem("exitShown");document.addEventListener("mouseleave",function(e){if(e.clientY<10&&!shown){ov.classList.add("show");shown=true;sessionStorage.setItem("exitShown","1");}});document.getElementById("exitClose").addEventListener("click",function(){ov.classList.remove("show");});document.getElementById("exitCta").addEventListener("click",function(){ov.classList.remove("show");});ov.addEventListener("click",function(e){if(e.target===ov)ov.classList.remove("show");});})();' +

    '<\/script></body></html>';
}
