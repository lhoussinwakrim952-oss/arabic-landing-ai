<body>

<script type="text/babel">

const {
  useState,
  useEffect,
  useRef
}=React;

/* =========================================================
   COUNTRIES MATRIX (مع العملات، الأكواد والمفاتيح)
========================================================= */

const COUNTRIES=[
  {code:"SA",name:"🇸🇦 السعودية",dialect:"السعودية",currency:"ريال سعودي",symbol:"ر.س",phoneCode:"+966"},
  {code:"MA",name:"🇲🇦 المغرب",dialect:"المغربية",currency:"درهم مغربي",symbol:"د.م",phoneCode:"+212"},
  {code:"AE",name:"🇦🇪 الإمارات",dialect:"الإماراتية",currency:"درهم إماراتي",symbol:"د.إ",phoneCode:"+971"},
  {code:"KW",name:"🇰🇼 الكويت",dialect:"الكويتية",currency:"دينار كويتي",symbol:"د.ك",phoneCode:"+965"},
  {code:"QA",name:"🇶🇦 قطر",dialect:"القطرية",currency:"ريال قطري",symbol:"ر.ق",phoneCode:"+974"},
  {code:"BH",name:"🇧🇭 البحرين",dialect:"البحرينية",currency:"دينار بحريني",symbol:"د.ب",phoneCode:"+973"},
  {code:"OM",name:"🇴🇲 عُمان",dialect:"العُمانية",currency:"ريال عُماني",symbol:"ر.ع",phoneCode:"+968"},
  {code:"EG",name:"🇪🇬 مصر",dialect:"المصرية",currency:"جنيه مصري",symbol:"ج.م",phoneCode:"+20"},
  {code:"IQ",name:"🇮🇶 العراق",dialect:"العراقية",currency:"دينار عراقي",symbol:"د.ع",phoneCode:"+964"},
  {code:"JO",name:"🇯🇴 الأردن",dialect:"الأردنية",currency:"دينار أردني",symbol:"د.أ",phoneCode:"+962"},
  {code:"DZ",name:"🇩🇿 الجزائر",dialect:"الجزائرية",currency:"دينار جزائري",symbol:"دج",phoneCode:"+213"},
  {code:"TN",name:"🇹🇳 تونس",dialect:"التونسية",currency:"دينار تونسي",symbol:"د.ت",phoneCode:"+216"},
  {code:"LY",name:"🇱🇾 ليبيا",dialect:"الليبية",currency:"دينار ليبي",symbol:"د.ل",phoneCode:"+218"},
  {code:"YE",name:"🇾🇪 اليمن",dialect:"اليمنية",currency:"ريال يمني",symbol:"ر.ي",phoneCode:"+967"}
];

const PRODUCT_CATEGORIES=[
  "إلكترونيات",
  "جمال وعناية",
  "منزل ومطبخ",
  "أزياء",
  "إكسسوارات",
  "رياضة",
  "سيارات",
  "أطفال",
  "منتجات طبيعية",
  "منتج عام"
];

/* =========================================================
   HELPERS
========================================================= */

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function splitDataURL(dataURL){
  const match=/^data:(.+?);base64,(.+)$/.exec(dataURL||"");
  return match ? { mediaType:match[1], base64:match[2] } : null;
}

function discountPercent(oldPrice,newPrice){
  const oldValue=Number(oldPrice);
  const newValue=Number(newPrice);
  if(!oldValue || !newValue || oldValue<=newValue) return 0;
  return Math.round(((oldValue-newValue)/oldValue)*100);
}

function cleanHTML(text){
  let result=(text||"").trim();
  result=result.replace(/^```html/i,"").replace(/^```/,"").replace(/```\s*$/i,"").trim();
  const start=result.search(/<!doctype html>|<html/i);
  if(start>0) result=result.slice(start);
  const end=result.toLowerCase().lastIndexOf("</html>");
  if(end!==-1) result=result.slice(0,end+7);
  return result.trim();
}

function replaceImageTokens(html,images){
  let result=html;
  for(let i=0;i<4;i++){
    result=result.split(`IMAGE_${i+1}_PLACEHOLDER`).join(images[i]?.dataUrl||"");
  }
  return result;
}

/* =========================================================
   CLAUDE GENERATION & FALLBACK MOCK
========================================================= */

async function generateLandingPageAPI(payload, form, country, images){
  try{
    const response = await fetch("/api/generate", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });
    
    if(!response.ok) throw new Error("السيرفر لم يستجب بالشكل المطلوب.");
    const data = await response.json();
    return data.text || data.html || data.content;
  }catch(e){
    // محاكاة فورية احترافية في حالة عدم توفر Backend API مباشر
    const discount = discountPercent(form.originalPrice, form.price);
    const img1 = images[0]?.dataUrl || '[https://via.placeholder.com/600x400](https://via.placeholder.com/600x400)';
    return `
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${form.name}</title>
<script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"><\/script>
<link href="[https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap](https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap)" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif;}</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div class="bg-indigo-600 text-white text-center py-2 text-xs font-bold">
    🚚 شحن سريع وتوصيل مباشر إلى ${country.name} الدفع عند الاستلام
  </div>
  <main class="max-w-3xl mx-auto px-4 py-8 space-y-6">
    <div class="text-center space-y-2">
      <span class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-xs px-3 py-1 rounded-full font-bold">
        عرض خاص لفترة محدودة ${discount ? `(خصم ${discount}%)` : ''}
      </span>
      <h1 class="text-3xl font-black text-white">${form.name}</h1>
      <p class="text-gray-400 text-sm">${form.description || 'أفضل خيار بمتطلبات عالية وجودة فائقة'}</p>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden p-4 space-y-4">
      <img src="${img1}" class="w-full h-80 object-cover rounded-xl" alt="${form.name}" />
      
      <div class="flex items-center justify-between border-t border-gray-800 pt-4">
        <div>
          <span class="text-2xl font-black text-indigo-400">${form.price} ${country.symbol}</span>
          ${form.originalPrice ? `<span class="text-sm text-gray-500 line-through mr-2">${form.originalPrice} ${country.symbol}</span>` : ''}
        </div>
        <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-lg">متوفر في المخزون</span>
      </div>
    </div>

    ${form.includeOrderForm ? `
    <div class="bg-gray-900 border border-indigo-500/30 p-6 rounded-2xl space-y-4">
      <h3 class="font-bold text-lg text-white text-center">أدخل معلوماتك للطلب المباشر</h3>
      <div class="space-y-3">
        <input type="text" placeholder="الاسم الكامل" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500" />
        <div class="flex gap-2 dir-ltr">
          <span class="bg-gray-800 border border-gray-700 p-3 rounded-xl text-sm font-mono text-gray-300">${country.phoneCode}</span>
          <input type="tel" placeholder="رقم الهاتف" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-right text-white focus:outline-none focus:border-indigo-500" />
        </div>
        <input type="text" placeholder="العنوان والمدينة" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500" />
        <button class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-xl shadow-lg transition-all text-base">تأكيد الطلب الآن 🛒</button>
      </div>
    </div>
    ` : `
    <button class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-xl shadow-lg transition-all text-base">اضغط هنا للطلب المباشر 🛒</button>
    `}
  </main>
</body>
</html>
    `;
  }
}

/* =========================================================
   MAIN APP COMPONENT
========================================================= */

function App(){
  const [screen,setScreen]=useState("form");
  const [form,setForm]=useState({
    name:"",
    category:"منتج عام",
    originalPrice:"",
    price:"",
    description:"",
    country:"SA",
    dialect:"auto",
    includeOrderForm:true
  });

  const [images,setImages]=useState([]);
  const [history,setHistory]=useState([]);
  const [historyIndex,setHistoryIndex]=useState(-1);
  const [error,setError]=useState("");
  const [loadingIndex,setLoadingIndex]=useState(0);
  const [instruction,setInstruction]=useState("");
  const [regenerating,setRegenerating]=useState(false);
  const [preview,setPreview]=useState("mobile");
  const [copyMessage,setCopyMessage]=useState("");
  const [jpgLoading,setJpgLoading]=useState(false);

  const iframeRef=useRef(null);
  const [iframeHeight,setIframeHeight]=useState(700);

  const currentHTML = historyIndex >= 0 ? history[historyIndex] : "";
  const country = COUNTRIES.find(x=>x.code===form.country) || COUNTRIES[0];

  const loadingMessages=[
    "جاري تحليل المنتج والصور...",
    "جاري ربط العملة والدولة المستهدفة أوتوماتيكياً...",
    "جاري اختيار التنسيق المالي وكود الهاتف...",
    "جاري بناء صفحة الهبوط وتناسق الهاتف...",
    "جاري تجهيز المعاينة النهائية..."
  ];

  useEffect(()=>{
    let timer;
    if(screen==="loading"){
      setLoadingIndex(0);
      timer=setInterval(()=>{
        setLoadingIndex(current => Math.min(current+1, loadingMessages.length-1));
      }, 1000);
    }
    return ()=>{ if(timer) clearInterval(timer); };
  },[screen]);

  async function uploadImages(event){
    const files=Array.from(event.target.files||[]).slice(0, 4 - images.length);
    const newImages=[];
    for(const file of files){
      try{
        const dataURL = await fileToDataURL(file);
        const parts = splitDataURL(dataURL);
        if(parts){
          newImages.push({
            dataUrl:dataURL,
            mediaType:parts.mediaType,
            base64:parts.base64,
            name:file.name
          });
        }
      }catch(e){}
    }
    setImages(old=>[...old,...newImages].slice(0,4));
    event.target.value="";
  }

  function removeImage(index){
    setImages(old=>old.filter((_,i)=>i!==index));
  }

  async function startGeneration(){
    setError("");
    if(!form.name.trim()){ setError("أدخل اسم المنتج أولاً."); return; }
    if(!form.price){ setError("أدخل سعر البيع."); return; }
    if(images.length===0){ setError("ارفع صورة واحدة للمنتج على الأقل."); return; }

    setScreen("loading");

    try{
      const rawHtml = await generateLandingPageAPI(form, form, country, images);
      let html = cleanHTML(rawHtml);
      html = replaceImageTokens(html, images);

      setHistory([html]);
      setHistoryIndex(0);
      setScreen("preview");
    }catch(err){
      setError(err.message || "حدث خطأ أثناء إنشاء الصفحة.");
      setScreen("form");
    }
  }

  async function regenerate(){
    if(!instruction.trim() || regenerating) return;
    setRegenerating(true);
    try{
      const rawHtml = await generateLandingPageAPI({ ...form, instruction }, form, country, images);
      let html = cleanHTML(rawHtml);
      html = replaceImageTokens(html, images);

      const base = history.slice(0, historyIndex+1);
      const next = [...base, html];
      setHistory(next);
      setHistoryIndex(next.length-1);
      setInstruction("");
    }catch(err){
      setError("تعذر تحديث التصميم.");
    }finally{
      setRegenerating(false);
    }
  }

  function undo(){ if(historyIndex>0) setHistoryIndex(historyIndex-1); }
  function redo(){ if(historyIndex < history.length-1) setHistoryIndex(historyIndex+1); }

  async function copyHTML(){
    if(!currentHTML) return;
    try{
      await navigator.clipboard.writeText(currentHTML);
      setCopyMessage("تم نسخ كود HTML بنجاح ✓");
    }catch{ setCopyMessage("تعذر النسخ."); }
    setTimeout(()=>setCopyMessage(""), 2000);
  }

  function downloadHTML(){
    if(!currentHTML) return;
    const blob = new Blob([currentHTML], {type:"text/html;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${form.name || 'landing-page'}.html`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function iframeLoaded(){
    try{
      const doc = iframeRef.current.contentDocument;
      const h = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight);
      setIframeHeight(Math.max(500, h+20));
    }catch(e){}
  }

  async function exportJPG(){
    if(!iframeRef.current || !window.html2canvas) return;
    setJpgLoading(true);
    try{
      const doc = iframeRef.current.contentDocument;
      const canvas = await window.html2canvas(doc.body, { scale:2, backgroundColor:"#ffffff" });
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/jpeg", 0.95);
      a.download = `${form.name || 'landing-page'}.jpg`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }catch(e){ setError("تعذر تصدير الصورة."); }
    finally{ setJpgLoading(false); }
  }

  if(screen==="form") return <Form form={form} setForm={setForm} country={country} images={images} uploadImages={uploadImages} removeImage={removeImage} error={error} generate={startGeneration} />;
  if(screen==="loading") return <Loading index={loadingIndex} messages={loadingMessages} />;

  return (
    <Preview 
      html={currentHTML} iframeRef={iframeRef} iframeHeight={iframeHeight} iframeLoaded={iframeLoaded}
      preview={preview} setPreview={setPreview} instruction={instruction} setInstruction={setInstruction}
      regenerate={regenerate} regenerating={regenerating} undo={undo} redo={redo}
      canUndo={historyIndex>0} canRedo={historyIndex < history.length-1}
      copyHTML={copyHTML} downloadHTML={downloadHTML} exportJPG={exportJPG} jpgLoading={jpgLoading}
      copyMessage={copyMessage} error={error} newProject={()=>{ setScreen("form"); setError(""); }}
    />
  );
}

/* =========================================================
   SUB-COMPONENTS (FORM, LOADING, PREVIEW, FIELD)
========================================================= */

function Form({form, setForm, country, images, uploadImages, removeImage, error, generate}){
  const discount = discountPercent(form.originalPrice, form.price);
  const update = (key, val) => setForm(old => ({...old, [key]: val}));

  return (
    <main className="fade" style={{minHeight:"100vh", padding:"30px 16px 80px", background:"radial-gradient(circle at 50% 0%,#11243b 0%,#070b12 50%)"}}>
      <div style={{maxWidth:740, margin:"auto"}}>
        <header style={{textAlign:"center", marginBottom:24}}>
          <div style={{display:"inline-flex", padding:"6px 14px", borderRadius:30, border:"1px solid #23415b", background:"#0d1b2c", color:"#38bdf8", fontSize:12, fontWeight:800, marginBottom:12}}>
            ⚡ NAFAS AI PRO - مولد صفحات الهبوط
          </div>
          <h1 style={{margin:"0 0 8px", fontSize:"clamp(24px,5vw,36px)", fontWeight:900}}>
            إنشاء صفحة بيع متوافقة <span style={{color:"#22d3ee"}}>مع كل الدول العربية</span>
          </h1>
        </header>

        <section style={{background:"rgba(15,23,42,.9)", border:"1px solid #22304a", borderRadius:20, padding:"24px", boxShadow:"0 20px 60px rgba(0,0,0,.4)"}}>
          <div style={{display:"grid", gap:16}}>
            <Field label="اسم المنتج / الخدمة *">
              <input value={form.name} onChange={e=>update("name",e.target.value)} placeholder="مثال: ساعة ذكية مقاومة للماء" style={inputStyle} />
            </Field>

            <div className="twoCols" style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:12}}>
              <Field label="الدولة المستهدفة (تغير تلقائي للعملة والكود)">
                <select value={form.country} onChange={e=>update("country",e.target.value)} style={inputStyle}>
                  {COUNTRIES.map(c=><option key={c.code} value={c.code}>{c.name} ({c.symbol} / {c.phoneCode})</option>)}
                </select>
              </Field>

              <Field label="فئة المنتج">
                <select value={form.category} onChange={e=>update("category",e.target.value)} style={inputStyle}>
                  {PRODUCT_CATEGORIES.map(cat=><option key={cat} value={cat}>{cat}</option>)}
                </select>
              </Field>
            </div>

            <div className="twoCols" style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:12}}>
              <Field label={`سعر البيع المباشر (${country.symbol}) *`}>
                <input type="number" value={form.price} onChange={e=>update("price",e.target.value)} placeholder="199" style={{...inputStyle, borderColor:"#22d3ee"}} />
              </Field>

              <Field label={`السعر قبل الخصم (${country.symbol})`}>
                <input type="number" value={form.originalPrice} onChange={e=>update("originalPrice",e.target.value)} placeholder="399" style={inputStyle} />
              </Field>
            </div>

            {discount > 0 && (
              <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", background:"#09201d", border:"1px solid #124a40", padding:"10px 14px", borderRadius:12}}>
                <span style={{color:"#8da09c", fontSize:12}}>نسبة التخفيض للعميل:</span>
                <strong style={{color:"#6ee7b7", background:"#103b32", borderRadius:8, padding:"4px 10px", fontSize:12}}>خصم {discount}%</strong>
              </div>
            )}

            <Field label="صور المنتج (حتى 4 صور)">
              <div style={{display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:8}}>
                {images.map((img, idx)=>(
                  <div key={idx} style={{position:"relative", aspectRatio:"1", borderRadius:12, overflow:"hidden", border:"1px solid #30405a"}}>
                    <img src={img.dataUrl} style={{width:"100%", height:"100%", objectFit:"cover"}} alt="" />
                    <button type="button" onClick={()=>removeImage(idx)} style={{position:"absolute", top:4, left:4, width:22, height:22, borderRadius:6, background:"rgba(0,0,0,.8)", color:"#fff", border:0, cursor:"pointer"}}>×</button>
                  </div>
                ))}
                {images.length < 4 && (
                  <label style={{aspectRatio:"1", border:"1.5px dashed #34455f", borderRadius:12, display:"flex", alignItems:"center", justifyCenter:"center", flexDirection:"column", cursor:"pointer", background:"#0a1220", color:"#77859b"}}>
                    <strong style={{fontSize:20}}>+</strong>
                    <span style={{fontSize:10}}>إضافة</span>
                    <input type="file" accept="image/*" multiple onChange={uploadImages} style={{display:"none"}} />
                  </label>
                )}
              </div>
            </Field>

            <Field label="وصف المنتج">
              <textarea value={form.description} onChange={e=>update("description",e.target.value)} rows="3" placeholder="أدخل تفاصيل ومميزات المنتج الرئيسية..." style={{...inputStyle, resize:"none"}} />
            </Field>

            <Field label="تضمين نموذج الطلب المباشر">
              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8}}>
                <button type="button" onClick={()=>update("includeOrderForm", true)} style={{...toggleStyle, background: form.includeOrderForm ? "#22d3ee" : "#0b1423", color: form.includeOrderForm ? "#031018" : "#b5c0d0"}}>نعم (+ نموذج طلب)</button>
                <button type="button" onClick={()=>update("includeOrderForm", false)} style={{...toggleStyle, background: !form.includeOrderForm ? "#22d3ee" : "#0b1423", color: !form.includeOrderForm ? "#031018" : "#b5c0d0"}}>لا (أزرار فقط)</button>
              </div>
            </Field>

            {error && <div style={{background:"#281419", border:"1px solid #54232d", color:"#fb7185", borderRadius:10, padding:"10px", fontSize:12}}>⚠️ {error}</div>}

            <button type="button" onClick={generate} style={{border:0, borderRadius:12, padding:"15px", cursor:"pointer", fontSize:15, fontWeight:900, color:"#031019", background:"linear-gradient(100deg,#3b82f6,#22d3ee)"}}>
              🚀 توليد صفحة الهبوط الآن
            </button>
          </div>
        </section>
      </div>
    </main>
  );
}

function Field({label, children}){
  return (
    <label style={{display:"grid", gap:6}}>
      <span style={{color:"#c1cada", fontSize:12, fontWeight:700}}>{label}</span>
      {children}
    </label>
  );
}

function Loading({index, messages}){
  return (
    <div className="fade" style={{minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", flexDirection:"column", padding:20}}>
      <div style={{width:32, height:32, borderRadius:"50%", border:"3px solid #20324b", borderTopColor:"#22d3ee", animation:"spin .8s linear infinite", marginBottom:16}} />
      <h2 style={{fontSize:16, margin:"0 0 8px"}}>{messages[index]}</h2>
    </div>
  );
}

function Preview(props){
  const { html, iframeRef, iframeHeight, iframeLoaded, preview, setPreview, instruction, setInstruction, regenerate, regenerating, undo, redo, canUndo, canRedo, copyHTML, downloadHTML, exportJPG, jpgLoading, copyMessage, error, newProject } = props;

  return (
    <div style={{minHeight:"100vh", background:"#05070c"}}>
      <div className="toolbar" style={{position:"sticky", top:0, zIndex:100, display:"flex", alignItems:"center", gap:6, padding:"8px 12px", background:"#0b1220", borderBottom:"1px solid #202d43"}}>
        <button onClick={newProject} style={toolbarButton}>← مشروع جديد</button>
        <div style={{flex:1}} />
        <button onClick={undo} disabled={!canUndo} style={{...toolbarButton, opacity:canUndo?1:.3}}>↶</button>
        <button onClick={redo} disabled={!canRedo} style={{...toolbarButton, opacity:canRedo?1:.3}}>↷</button>
        <button onClick={()=>setPreview("mobile")} style={{...toolbarButton, background: preview==="mobile"?"#22d3ee":"#111a29", color: preview==="mobile"?"#000":"#fff"}}>📱 هاتف</button>
        <button onClick={()=>setPreview("desktop")} style={{...toolbarButton, background: preview==="desktop"?"#22d3ee":"#111a29", color: preview==="desktop"?"#000":"#fff"}}>🖥 حاسوب</button>
        <button onClick={copyHTML} style={toolbarButton}>📋 نسخ</button>
        <button onClick={exportJPG} disabled={jpgLoading} style={toolbarButton}>{jpgLoading?"...":"🖼 JPG"}</button>
        <button onClick={downloadHTML} style={{...toolbarButton, background:"#22d3ee", color:"#000", fontWeight:900}}>⬇ تحميل HTML</button>
      </div>

      {copyMessage && <div style={{textAlign:"center", padding:4, background:"#0b241f", color:"#6ee7b7", fontSize:11}}>{copyMessage}</div>}

      <div style={{display:"flex", gap:8, padding:10, background:"#0b1220", borderBottom:"1px solid #202d43"}}>
        <input value={instruction} disabled={regenerating} onChange={e=>setInstruction(e.target.value)} placeholder="اطلب تعديلاً بالذكاء الاصطناعي (مثال: غير اللون الرئيسي إلى الأخضر)..." style={{...inputStyle, flex:1}} />
        <button onClick={regenerate} disabled={regenerating || !instruction.trim()} style={{...toolbarButton, background:"#2563eb", color:"#fff"}}>
          {regenerating ? "جاري التعديل..." : "🪄 تطبيق التعديل"}
        </button>
      </div>

      <div style={{padding:"20px 10px", display:"flex", justifyContent:"center"}}>
        <div style={{width: preview==="mobile"?375:"100%", maxWidth: preview==="mobile"?375:1100, background:"#fff", borderRadius: preview==="mobile"?24:8, overflow:"hidden", border:"4px solid #1c2432"}}>
          <iframe ref={iframeRef} srcDoc={html} title="Preview" onLoad={iframeLoaded} style={{width:"100%", height:iframeHeight, border:0, display:"block"}} />
        </div>
      </div>
    </div>
  );
}

/* =========================================================
   STYLES
========================================================= */

const inputStyle={width:"100%", border:"1px solid #2a3952", background:"#09111e", color:"#f8fafc", borderRadius:10, padding:"10px 12px", outline:"none", fontSize:13};
const toggleStyle={border:"1px solid #2a3952", borderRadius:10, padding:"10px", cursor:"pointer", fontSize:12, fontWeight:800};
const toolbarButton={display:"flex", alignItems:"center", gap:4, border:"1px solid #29374d", borderRadius:8, background:"#111a29", color:"#e2e8f0", padding:"6px 10px", cursor:"pointer", fontSize:11, fontWeight:800};

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);

</script>
</body>
</html>
