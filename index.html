function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();

    reader.onload=()=>{
      resolve(reader.result);
    };

    reader.onerror=reject;

    reader.readAsDataURL(file);
  });
}


function splitDataURL(dataURL){
  const match=
    /^data:(.+?);base64,(.+)$/.exec(
      dataURL||""
    );

  if(!match){
    return null;
  }

  return {
    mediaType:match[1],
    base64:match[2]
  };
}


function discountPercent(oldPrice,newPrice){

  const oldValue=Number(oldPrice);
  const newValue=Number(newPrice);

  if(
    !oldValue ||
    !newValue ||
    oldValue<=newValue
  ){
    return 0;
  }

  return Math.round(
    ((oldValue-newValue)/oldValue)*100
  );
}


function cleanHTML(text){

  let result=(text||"").trim();

  result=result
    .replace(/^```html/i,"")
    .replace(/^```/,"")
    .replace(/```\s*$/i,"")
    .trim();

  const start=
    result.search(
      /<!doctype html>|<html/i
    );

  if(start>0){
    result=result.slice(start);
  }

  const end=
    result.toLowerCase()
      .lastIndexOf("</html>");

  if(end!==-1){
    result=result.slice(
      0,
      end+7
    );
  }

  return result.trim();
}


function replaceImageTokens(html,images){

  let result=html;

  for(let i=0;i<4;i++){

    result=
      result
      .split(
        `IMAGE_${i+1}_PLACEHOLDER`
      )
      .join(
        images[i]?.dataUrl||""
      );
  }

  return result;
}


/* =========================================================

async function generateWithClaude(
  content,
  maxTokens=12000
){

  const response=
    await fetch(
      "/api/generate",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify({
          content,
          max_tokens:maxTokens
        })
      }
    );

  let data;

  try{
    data=await response.json();
  }catch{
    throw new Error(
      "الخادم رجّع استجابة غير صالحة."
    );
  }

  if(!response.ok){

    throw new Error(
      data?.error ||
      "حدث خطأ أثناء الاتصال بـ Claude."
    );

  }

  if(!data?.text){

    throw new Error(
      "Claude لم يرجع HTML."
    );

  }

  return data.text;
}

    ) || COUNTRIES[0];

  const loadingMessages=[
    "جاري تحليل المنتج والصور...",
    "جاري اختيار الهوية البصرية...",
    "جاري بناء هيكلة الصفحة...",
    "جاري كتابة الـ Copywriting...",
    "جاري تحسين نسخة الهاتف...",
    "جاري إضافة CTA والعروض...",
    "جاري فحص الصفحة النهائية..."
  ];


  useEffect(()=>{

    let timer;

    if(screen==="loading"){

      setLoadingIndex(0);

      timer=setInterval(()=>{

        setLoadingIndex(
          current=>
            Math.min(
              current+1,
              loadingMessages.length-1
            )
        );

      },1300);

    }

    return()=>{
      if(timer){
        clearInterval(timer);
      }
    };

  },[screen]);


  /* =====================================================
     UPLOAD
  ===================================================== */

  async function uploadImages(event){

    const files=
      Array.from(
        event.target.files||[]
      ).slice(
        0,
        4-images.length
      );

    const newImages=[];

    for(const file of files){

      try{

        const dataURL=
          await fileToDataURL(file);

        const parts=
          splitDataURL(dataURL);

        if(parts){

          newImages.push({
            dataUrl:dataURL,
            mediaType:parts.mediaType,
            base64:parts.base64,
            name:file.name
          });

        }

      }catch(e){}

    }

    setImages(
      old=>
        [...old,...newImages]
        .slice(0,4)
    );

    event.target.value="";
  }


  function removeImage(index){

    setImages(
      old=>
        old.filter(
          (_,i)=>i!==index
        )
    );
  }


  /* =====================================================
     GENERATE
  ===================================================== */

  async function generate(extra=""){

    const style=
      randomStyle();

    const prompt=
      buildPrompt(
        form,
        country,
        images,
        extra,
        style
      );

    const content=[
      {
        type:"text",
        text:prompt
      }
    ];

    images.forEach(image=>{

      content.push({
        type:"image",
        source:{
          type:"base64",
          media_type:image.mediaType,
          data:image.base64
        }
      });

    });

    const response=
      await generateWithClaude(
        content,
        14000
      );

    let html=
      cleanHTML(response);

    html=
      replaceImageTokens(
        html,
        images
      );

    if(
      !html ||
      html.length<500
    ){
      throw new Error(
        "Claude رجع صفحة ناقصة أو غير صالحة."
      );
    }

    return html;
  }


  async function startGeneration(){

    setError("");

    if(!form.name.trim()){
      setError("كتب اسم المنتج أولاً.");
      return;
    }

    if(!form.originalPrice){
      setError("دخل السعر الأصلي.");
      return;
    }

    if(!form.price){
      setError("دخل سعر البيع.");
      return;
    }

    if(images.length===0){
      setError("خاصك ترفع صورة واحدة على الأقل.");
      return;
    }

    setScreen("loading");

    try{

      const html=
        await generate();

      setHistory([html]);

      setHistoryIndex(0);

      setScreen("preview");

    }catch(error){

      setError(
        error.message ||
        "حدث خطأ أثناء التوليد."
      );

      setScreen("form");
    }
  }


  /* =====================================================
     REGENERATE
  ===================================================== */

  async function regenerate(){

    if(
      !instruction.trim() ||
      regenerating
    ){
      return;
    }

    setRegenerating(true);

    setError("");

    try{

      const html=
        await generate(
          instruction.trim()
        );

      const base=
        history.slice(
          0,
          historyIndex+1
        );

      const next=[
        ...base,
        html
      ];

      setHistory(next);

      setHistoryIndex(
        next.length-1
      );

      setInstruction("");

    }catch(error){

      setError(
        error.message ||
        "تعذر إعادة التصميم."
      );

    }finally{

      setRegenerating(false);
    }
  }


  /* =====================================================
     UNDO / REDO
  ===================================================== */

  function undo(){

    if(historyIndex>0){

      setHistoryIndex(
        historyIndex-1
      );

    }
  }


  function redo(){

    if(
      historyIndex<
      history.length-1
    ){

      setHistoryIndex(
        historyIndex+1
      );

    }
  }


  /* =====================================================
     COPY
  ===================================================== */

  async function copyHTML(){

    if(!currentHTML){
      return;
    }

    try{

      await navigator.clipboard.writeText(
        currentHTML
      );

      setCopyMessage(
        "تم نسخ HTML ✓"
      );

    }catch{

      setCopyMessage(
        "تعذر النسخ."
      );

    }

    setTimeout(
      ()=>setCopyMessage(""),
      2200
    );
  }


  /* =====================================================
     DOWNLOAD HTML
  ===================================================== */

  function downloadHTML(){

    if(!currentHTML){
      return;
    }

    const blob=
      new Blob(
        [currentHTML],
        {
          type:"text/html;charset=utf-8"
        }
      );

    const url=
      URL.createObjectURL(blob);

    const a=
      document.createElement("a");

    a.href=url;

    a.download=
      (
        form.name||
        "landing-page"
      )
      .trim()
      .replace(
        /[^\w\u0600-\u06FF]+/g,
        "-"
      )
      +".html";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);
  }


  /* =====================================================
     IFRAME LOAD
  ===================================================== */

  function iframeLoaded(){

    try{

      const doc=
        iframeRef.current
          .contentDocument;

      const h=
        Math.max(
          doc.body.scrollHeight,
          doc.documentElement.scrollHeight
        );

      setIframeHeight(
        Math.max(500,h+20)
      );

    }catch(e){}
  }


  /* =====================================================
     JPG
  ===================================================== */

  async function exportJPG(){

    if(
      !iframeRef.current ||
      !window.html2canvas
    ){
      return;
    }

    setJpgLoading(true);

    try{

      const doc=
        iframeRef.current
          .contentDocument;

      const canvas=
        await window.html2canvas(
          doc.body,
          {
            scale:2,
            useCORS:true,
            backgroundColor:"#ffffff",
            logging:false,
            windowWidth:
              doc.documentElement.scrollWidth,
            windowHeight:
              doc.documentElement.scrollHeight
          }
        );

      const a=
        document.createElement("a");

      a.href=
        canvas.toDataURL(
          "image/jpeg",
          .95
        );

      a.download=
        (
          form.name||
          "landing-page"
        )+".jpg";

      document.body.appendChild(a);

      a.click();

      a.remove();

    }catch(e){

      setError(
        "تعذر تصدير JPG."
      );

    }finally{

      setJpgLoading(false);
    }
  }


  /* =====================================================
     FORM
  ===================================================== */

  if(screen==="form"){

    return(
      <Form
        form={form}
        setForm={setForm}
        country={country}
        images={images}
        uploadImages={uploadImages}
        removeImage={removeImage}
        error={error}
        generate={startGeneration}
      />
    );
  }


  /* =====================================================
     LOADING
  ===================================================== */

  if(screen==="loading"){

    return(
      <Loading
        index={loadingIndex}
        messages={loadingMessages}
      />
    );
  }


  /* =====================================================
     PREVIEW
  ===================================================== */

  return(
    <Preview
      html={currentHTML}
      iframeRef={iframeRef}
      iframeHeight={iframeHeight}
      iframeLoaded={iframeLoaded}
      preview={preview}
      setPreview={setPreview}
      instruction={instruction}
      setInstruction={setInstruction}
      regenerate={regenerate}
      regenerating={regenerating}
      undo={undo}
      redo={redo}
      canUndo={historyIndex>0}
      canRedo={
        historyIndex<
        history.length-1
      }
      copyHTML={copyHTML}
      downloadHTML={downloadHTML}
      exportJPG={exportJPG}
      jpgLoading={jpgLoading}
      copyMessage={copyMessage}
      error={error}
      newProject={()=>{
        setScreen("form");
        setError("");
      }}
    />
  );
}

          disabled={!canRedo}
          style={{
            ...toolbarButton,
            opacity:canRedo?1:.35
          }}
        >
          ↷
        </button>


        <div
          style={{
            display:"flex",
            gap:2,
            background:"#121b2a",
            borderRadius:8,
            padding:3
          }}
        >

          <button
            onClick={()=>
              setPreview("mobile")
            }
            style={{
              ...modeButton,
              background:
                preview==="mobile"
                  ? "#22d3ee"
                  : "transparent",
              color:
                preview==="mobile"
                  ? "#031019"
                  : "#9eabbe"
            }}
          >
            📱
          </button>

          <button
            onClick={()=>
              setPreview("desktop")
            }
            style={{
              ...modeButton,
              background:
                preview==="desktop"
                  ? "#22d3ee"
                  : "transparent",
              color:
                preview==="desktop"
                  ? "#031019"
                  : "#9eabbe"
            }}
          >
            🖥
          </button>

        </div>


        <button
          onClick={copyHTML}
          style={toolbarButton}
        >
          📋 نسخ
        </button>

        <button
          onClick={exportJPG}
          disabled={jpgLoading}
          style={{
            ...toolbarButton,
            opacity:jpgLoading?.5:1
          }}
        >
          {jpgLoading
            ? "⟳"
            : "🖼 JPG"}
        </button>

        <button
          onClick={downloadHTML}
          style={{
            ...toolbarButton,
            background:"#22d3ee",
            borderColor:"#22d3ee",
            color:"#031019"
          }}
        >
          ⬇ HTML
        </button>

      </div>


      {copyMessage && (

        <div
          style={{
            textAlign:"center",
            padding:6,
            background:"#0b241f",
            color:"#6ee7b7",
            fontSize:11
          }}
        >
          {copyMessage}
        </div>

      )}


      {/* AI EDITOR */}

      <div
        style={{
          display:"flex",
          gap:8,
          padding:10,
          background:"#0b1220",
          borderBottom:
            "1px solid #202d43"
        }}
      >

        <input
          value={instruction}
          disabled={regenerating}
          onChange={e=>
            setInstruction(e.target.value)
          }
          onKeyDown={e=>{
            if(e.key==="Enter"){
              regenerate();
            }
          }}
          placeholder="مثال: خليه أفخم، بدل اللون للأخضر، زيد قسم طريقة الاستعمال، قصّر الصفحة..."
          style={{
            ...inputStyle,
            flex:1
          }}
        />

        <button
          onClick={regenerate}
          disabled={
            regenerating ||
            !instruction.trim()
          }
          style={{
            ...toolbarButton,
            background:"#2563eb",
            borderColor:"#2563eb",
            color:"#fff",
            opacity:
              regenerating ||
              !instruction.trim()
                ? .45
                : 1
          }}
        >
          {regenerating
            ? "⟳ جاري..."
            : "🪄 تعديل"}
        </button>

      </div>


      {error && (

        <div
          style={{
            padding:7,
            textAlign:"center",
            background:"#251319",
            color:"#fb7185",
            fontSize:11
          }}
        >
          {error}
        </div>

      )}


      {/* PREVIEW AREA */}

      <div
        style={{
          minHeight:
            "calc(100vh - 115px)",
          padding:"30px 14px 80px",
          display:"flex",
          justifyContent:"center",
          alignItems:"flex-start",
          background:
            "radial-gradient(circle at top,#111a2a,#05070c 55%)"
        }}
      >

        <div
          style={{
            width:
              preview==="mobile"
                ? 390
                : "min(1200px,100%)",
            maxWidth:
              preview==="mobile"
                ? 390
                : 1200,
            background:"#fff",
            borderRadius:
              preview==="mobile"
                ? 28
                : 12,
            overflow:"hidden",
            border:
              preview==="mobile"
                ? "8px solid #1c2432"
                : "1px solid #26334a",
            boxShadow:
              "0 35px 100px rgba(0,0,0,.55)"
          }}
        >

          <iframe
            ref={iframeRef}
            srcDoc={html}
            title="Landing Page Preview"
            onLoad={iframeLoaded}
            style={{
              width:"100%",
              height:iframeHeight,
              border:0,
              display:"block",
              background:"#fff"
            }}
          />

        </div>

      </div>

    </div>
  );
}


/* =========================================================
   STYLES
========================================================= */

const inputStyle={
  width:"100%",
  border:"1px solid #2a3952",
  background:"#09111e",
  color:"#f8fafc",
  borderRadius:11,
  padding:"12px 13px",
  outline:"none",
  fontSize:13
};

const toggleStyle={
  border:"1px solid #2a3952",
  borderRadius:11,
  padding:"12px",
  cursor:"pointer",
  fontSize:12,
  fontWeight:800
};

const toolbarButton={
  display:"flex",
  alignItems:"center",
  justifyContent:"center",
  gap:5,
  border:"1px solid #29374d",
  borderRadius:8,
  background:"#111a29",
  color:"#e2e8f0",
  padding:"8px 11px",
  cursor:"pointer",
  fontSize:11,
  fontWeight:800,
  whiteSpace:"nowrap"
};

const modeButton={
  border:0,
  borderRadius:6,
  padding:"6px 9px",
  cursor:"pointer",
  fontSize:12
};


/* =========================================================
   START
========================================================= */

const root=
  ReactDOM.createRoot(
    document.getElementById("root")
  );

root.render(
  <App/>
);

</script>

</body>
</html>
