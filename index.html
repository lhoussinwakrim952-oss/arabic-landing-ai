function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
// نضغط ونصغّر الصورة قبل رفعها: الصور الأصلية من الهاتف (4-8 ميجابكسل) توصل حجمها بعد base64
// لمئات الكيلوبايت لكل صورة، وبمجموع 8 صور يمكن تتجاوز حد حجم الطلب المسموح به عند السيرفر (fetch إلى /api/generate)
// فيتلقى المستخدم خطأ "Request Entity Too Large" بدل رد JSON. هذا التصغير يبقي جودة كافية للعرض والتحليل، ويقلل الحجم بشكل كبير.
function resizeImageDataUrl(dataUrl, maxDim, quality) {
  maxDim = maxDim || 1600;
  quality = quality || 0.85;
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > maxDim || h > maxDim) {
          if (w >= h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
          else { w = Math.round(w * (maxDim / h)); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      } catch (e) { reject(e); }
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}
function dataUrlParts(dataUrl) {
  const m = /^data:(.+?);base64,(.+)$/.exec(dataUrl || "");
  return m ? { mediaType: m[1], base64: m[2] } : null;
}
function enhanceImageForAds(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext("2d");
        if (ctx.filter !== undefined) {
          ctx.filter = "contrast(114%) saturate(128%) brightness(105%)";
        }
        ctx.drawImage(img, 0, 0);
        resolve(canvas.toDataURL("image/jpeg", 0.92));
      } catch (e) { reject(e); }
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

}
function stripToJSON(text) {
  let t = (text || "").trim();
  t = t.replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
  const s = t.indexOf("{"), e = t.lastIndexOf("}");
  if (s !== -1 && e !== -1) t = t.slice(s, e + 1);

async function callClaude(content, raw) {

  let response;
  try {
    response = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content }),

  } catch (netErr) {
    throw new Error("تعذّر الوصول للسيرفر. تأكد من اتصالك بالإنترنت أو أن نقطة /api/generate تعمل بشكل صحيح.");
  }
  const rawText = await response.text();
  let data;
  try {
    data = JSON.parse(rawText);
  } catch (parseErr) {

    const preview = (rawText || "").trim().slice(0, 120);
    if (response.status === 413 || /request entity too large/i.test(preview)) {
      throw new Error("حجم الصور المرسلة كبير بزاف على السيرفر (خطأ 413: Request Entity Too Large). جرّب صور أقل أو بجودة أخف.");
    }
    if (response.status === 404) {
      throw new Error("نقطة الاتصال /api/generate غير موجودة على السيرفر. تأكد من إعداد الـ backend.");
    }
    if (response.status === 504 || response.status === 408) {
      throw new Error("انتهت مهلة الاتصال بالسيرفر (Timeout). حاول مرة أخرى.");
    }
    throw new Error("رد غير متوقع من السيرفر (كود " + response.status + "): " + (preview || "لا يوجد محتوى") + (preview.length >= 120 ? "…" : ""));
  }
  if (!response.ok) throw new Error(data.error || "تعذّر الاتصال بمحرك الذكاء الاصطناعي (كود " + response.status + ").");
  if (!data.text) throw new Error("لم يصل رد نصي من المحرك");
  let parsed;
  try { parsed = stripToJSON(data.text); }
  catch (jsonErr) {
    if (data.stop_reason === "max_tokens" || data.truncated) throw new Error("توقف التوليد لأن المحتوى طويل جداً.");
    throw new Error("رد غير مكتمل من المحرك، حاول مرة أخرى.");
  }
  return raw ? parsed : validateGeneratedData(parsed);
}

/* ===== حل مشكلة "المحتوى طويل جداً": تقسيم + إعادة محاولة تلقائية ===== */
function isTooLongError(e) {
  return /طويل جد|max_tokens|truncat|too long|غير مكتمل/i.test((e && e.message) || "");
}
// استدعاء عادي (صفحة كاملة) مع إعادة محاولة تلقائية بتعليمات اختصار إذا طال الرد
async function callClaudeAuto(content) {
  try { return await callClaude(content); }
  catch (e) {
    if (!isTooLongError(e)) throw e;
    const note = "\n\nتنبيه مهم: الرد السابق طال وانقطع. اجعل كل نص مختصراً (جملة أو جملتين)، وكل قائمة 3 عناصر فقط، واختر 6 أقسام كحد أقصى، وأعد JSON مكتملاً وصحيحاً فقط.";
    const shorter = content.map((c, i) => (i === 0 && c.type === "text") ? { type: "text", text: c.text + note } : c);
    try { return await callClaude(shorter); }
    catch (e2) {
      if (!isTooLongError(e2)) throw e2;
      const note2 = "\n\nأقصى اختصار: 4 أقسام فقط، 3 عناصر لكل قائمة، نص كل عنصر لا يزيد عن 12 كلمة.";
      return await callClaude(shorter.map((c, i) => (i === 0 && c.type === "text") ? { type: "text", text: c.text + note2 } : c));
    }
  }
}

let __sbClientPromise = null;
function getSupabaseClient() {
  if (__sbClientPromise) return __sbClientPromise;
  __sbClientPromise = fetch("/api/supabase-config")
    .then((r) => { if (!r.ok) throw new Error("config-fetch-failed"); return r.json(); })
    .then((cfg) => {
      if (!cfg || !cfg.url || !cfg.key || typeof window.supabase === "undefined") return null;
      return window.supabase.createClient(cfg.url, cfg.key, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },

}

function mapAuthError(err) {
  const msg = (err && err.message) || "";
  if (/already registered|already exists|user_repeated_signup/i.test(msg)) return "هذا البريد الإلكتروني مسجّل مسبقاً. جرّب تسجيل الدخول.";
  if (/invalid login credentials/i.test(msg)) return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
  if (/password should be at least/i.test(msg)) return "كلمة المرور يجب ألا تقل عن 6 أحرف.";
  if (/email not confirmed/i.test(msg)) return "لم يتم تأكيد البريد الإلكتروني بعد. تحقق من صندوق الوارد.";
  if (/unable to validate email|invalid email/i.test(msg)) return "صيغة البريد الإلكتروني غير صحيحة.";
  if (/rate limit/i.test(msg)) return "محاولات كثيرة جداً. حاول مرة أخرى بعد قليل.";
  return msg || "حدث خطأ غير متوقع. حاول مرة أخرى.";
}

/* Token/environment come from /api/paddle-config (env vars on Vercel). Nothing hard-coded. */
let __paddleReady = null;
function getPaddle() {
  if (__paddleReady) return __paddleReady;
  __paddleReady = fetch("/api/paddle-config")
    .then(async (r) => {
      const cfg = await r.json().catch(() => null);
      if (!r.ok || !cfg || !cfg.token) throw new Error((cfg && cfg.error) || "Paddle config request failed.");
      if (typeof window.Paddle === "undefined") throw new Error("Paddle.js failed to load.");
      if (cfg.environment !== "production" || !/^live_/.test(cfg.token)) {
        throw new Error("Paddle must run in the live environment with a live_ token.");
      }
      window.Paddle.Environment.set("production");
      window.Paddle.Initialize({
        token: cfg.token,
        eventCallback: (ev) => {
          if (ev && ev.name === "checkout.completed") window.location.href = "/welcome";
        },
      });
      return { country: cfg.country || null };
    })
    .catch((e) => { __paddleReady = null; throw e; });
  return __paddleReady;
}

// Returns { [priceId]: formattedTotals.total } exactly as Paddle formats it (no frontend math/formatting).
async function loadPaddlePrices(tiers) {
  const { country } = await getPaddle();
  const req = { items: tiers.map((t) => ({ priceId: t.priceId, quantity: 1 })) };
  if (country) req.address = { countryCode: country }; // else Paddle auto-detects from IP
  const res = await window.Paddle.PricePreview(req);
  const out = {};
  res.data.details.lineItems.forEach((li) => { out[li.price.id] = li.formattedTotals.total; });
  return out;
}

async function openPaddleCheckout(priceId, email, userId) {
  await getPaddle();
  const payload = {
    items: [{ priceId: priceId, quantity: 1 }],
    settings: { displayMode: "overlay", variant: "one-page" },
  };
  if (email) payload.customer = { email: email };
  if (userId) payload.customData = { userId: userId }; // webhook.js reads custom_data.userId
  window.Paddle.Checkout.open(payload);
}

function CreditsModal({ open, onClose, onBuy, buying, buyError }) {
  const [prices, setPrices] = useState(null);
  const [priceError, setPriceError] = useState("");
  useEffect(() => {
    if (!open || prices) return;
    let cancelled = false;
    loadPaddlePrices(CREDIT_PLANS)
      .then((p) => { if (!cancelled) { setPrices(p); setPriceError(""); } })
      .catch((e) => { if (!cancelled) setPriceError(e && e.message ? e.message : "تعذّر تحميل الأسعار."); });
    return () => { cancelled = true; };
  }, [open, prices]);
  if (!open) return null;
  const err = buyError || priceError;
  return (
    <div className="credits-modal-backdrop" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="credits-modal glass" dir="rtl">
        <button className="credits-modal-close" onClick={onClose} aria-label="إغلاق">✕</button>
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <div style={{ fontSize: 30 }}>⚡</div>
          <h2 style={{ margin: "6px 0", color: "#F1F5F9", fontSize: 21 }}>اشترِ نقاط التوليد</h2>
          <p style={{ margin: 0, color: "#8B96AC", fontSize: 12.5 }}>كل صفحة هبوط يتم توليدها تستهلك نقطة واحدة.</p>
        </div>
        <div className="credit-plans">
          {CREDIT_PLANS.map((plan) => {
            const price = prices && prices[plan.priceId];
            return (
              <div key={plan.priceId} className={"credit-plan " + (plan.popular ? "popular" : "")}>
                {plan.popular && <span className="credit-popular">الأكثر طلباً</span>}
                <div className="credit-plan-name">{plan.name}</div>
                <div className="credit-plan-number">{plan.credits} <small>نقطة</small></div>
                <div className={"credit-plan-price" + (price ? "" : " muted")}>{price || (priceError ? "—" : "...")}</div>
                <p className="credit-plan-desc">{plan.description}</p>
                <ul className="credit-plan-features">
                  {plan.features.map((f) => <li key={f}>{f}</li>)}
                </ul>
                <button onClick={() => onBuy(plan.priceId)} disabled={buying}>
                  {buying ? "جاري الفتح..." : "شراء النقاط"}
                </button>
              </div>
            );
          })}
        </div>
        {err && <p className="credit-plans-error" dir="ltr">{err}</p>}
      </div>
    </div>
  );
}

function AccountMenu({ email, credits, loading, isAdmin, onLogout, onBuy }) {
  const [open, setOpen] = useState(false);
  const initial = ((email || "U").trim().charAt(0) || "U").toUpperCase();
  const wrapRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    const closeOnOutside = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    };
    const closeOnEscape = (e) => {
      if (e.key === "Escape") setOpen(false);
    };
    document.addEventListener("mousedown", closeOnOutside);
    document.addEventListener("touchstart", closeOnOutside, { passive: true });
    document.addEventListener("keydown", closeOnEscape);
    return () => {
      document.removeEventListener("mousedown", closeOnOutside);
      document.removeEventListener("touchstart", closeOnOutside);
      document.removeEventListener("keydown", closeOnEscape);
    };
  }, [open]);

  return (
    <div className="account-wrap" dir="rtl" ref={wrapRef}>
      <button type="button" className="account-avatar" onClick={() => setOpen((v) => !v)} aria-label="حساب المستخدم" aria-expanded={open}><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4.5 20.5c0-3.9 3.4-6.5 7.5-6.5s7.5 2.6 7.5 6.5" /></svg></button>
      {open && (
        <div className="account-dropdown">
          <div className="account-email">{email || "حساب المستخدم"}</div>
          {isAdmin ? (
            <div className="account-credit-row">
              <span>👑 Admin</span>
              <strong>وضع الاختبار</strong>
            </div>
          ) : (
            <div className="account-credit-row">
              <span>⚡ الرصيد</span>
              <strong>{loading ? "..." : (credits ?? 0) + " نقطة"}</strong>
            </div>
          )}
          {!isAdmin && (
            <button type="button" className="account-buy" onClick={() => { setOpen(false); onBuy(); }}>＋ شراء نقاط</button>
          )}
          <button type="button" className="account-logout" onClick={() => { setOpen(false); onLogout(); }}>🚪 تسجيل الخروج</button>
        </div>
      )}
    </div>
  );
}

function decodeLP(b64) {
  const bin = atob(b64);
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}

function LandingPhone({ item, cls, onPick }) {
  const stop = useRef(null);
  const html = React.useMemo(() => decodeLP(window.__LP[item.key]), [item.key]);
  useEffect(() => () => { if (stop.current) stop.current(); }, []);
  const onLoad = (e) => {
    if (stop.current) stop.current();
    let w, d;
    try { w = e.target.contentWindow; d = w.document.documentElement; } catch (err) { return; }
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let y = null, dir = 1, last = performance.now(), raf = 0;
    const tick = (t) => {
      const max = Math.max(0, d.scrollHeight - w.innerHeight);
      if (y === null && max > 0) y = max * item.start;
      if (y !== null && !reduce) {
        y += dir * 60 * Math.min(0.05, (t - last) / 1000);
        if (y >= max) { y = max; dir = -1; }
        if (y <= 0) { y = 0; dir = 1; }
        w.scrollTo({ top: y, behavior: "instant" });
      }
      last = t;
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    stop.current = () => cancelAnimationFrame(raf);
  };
  return (
    <div className={"hp-ph " + cls} onClick={cls === "c" ? undefined : onPick}>
      <iframe srcDoc={html} title={item.name} loading="eager" tabIndex={-1} sandbox="allow-scripts allow-same-origin" onLoad={onLoad} />
    </div>
  );
}

function PhoneShowcase() {
  const n = SHOWCASE.length;
  const [active, setActive] = useState(0);
  const drag = useRef(null);
  useEffect(() => {
    const t = setTimeout(() => setActive((a) => (a + 1) % n), 5000);
    return () => clearTimeout(t);
  }, [active, n]);
  const down = (e) => { drag.current = e.clientX; };
  const up = (e) => {
    if (drag.current === null) return;
    const dx = e.clientX - drag.current; drag.current = null;
    if (Math.abs(dx) > 40) setActive((a) => (a + (dx < 0 ? 1 : n - 1)) % n);
  };
  return (
    <div className="hp-phonewrap">
      <h2 className="hp-showtitle">صفحة هبوط <span>تبيع</span> في دقائق</h2>
      <div className="hp-stage" onPointerDown={down} onPointerUp={up} onPointerCancel={() => { drag.current = null; }}>
        {SHOWCASE.map((it, i) => {
          const rel = (i - active + n) % n;
          return <LandingPhone key={it.key} item={it} cls={rel === 0 ? "c" : rel === 1 ? "r" : "l"} onPick={() => setActive(i)} />;
        })}
      </div>
      <div className="hp-dots">{SHOWCASE.map((_, i) => <i key={i} className={i === active ? "on" : ""} onClick={() => setActive(i)} />)}</div>
    </div>
  );
}

function AuthGate() {
  const [ready, setReady] = useState(false);
  const [configError, setConfigError] = useState(false);
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [profileLoading, setProfileLoading] = useState(false);
  const [credits, setCredits] = useState(0);
  const [showBuyModal, setShowBuyModal] = useState(false);
  const [buying, setBuying] = useState(false);
  const [buyError, setBuyError] = useState("");
  const [editorPreview, setEditorPreview] = useState(false);
  const [view, setView] = useState("home");
  const [recoveryMode, setRecoveryMode] = useState(false);
  const [legalPage, setLegalPage] = useState(null);
  const [pricingOpen, setPricingOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [msg, setMsg] = useState("");
  const clientRef = useRef(null);

  async function fetchProfile(client, userId) {
    setProfileLoading(true);
    try {
      // نظام النقاط يعتمد على users. profiles يبقى fallback للتوافق مع النسخة الحالية.
      let result = await client.from("users").select("credits").eq("id", userId).single();
      if (result.error) {
        result = await client.from("profiles").select("email, credits").eq("id", userId).single();
      }
      // role مزيدة فـ profiles فقط (عمود الصلاحيات لي زدناه بالـ SQL) — نجيبها بطلب منفصل،
      // "best effort": إذا فشلت (مثلاً العمود ماكاينش) ما كتأثرش على الرصيد أو باقي المنصة.
      let role = "user";
      try {
        const roleResult = await client.from("profiles").select("role").eq("id", userId).single();
        if (!roleResult.error && roleResult.data && roleResult.data.role) role = roleResult.data.role;
      } catch (e3) {}
      if (!result.error && result.data) {
        setProfile({ ...result.data, role });
        setCredits(Number(result.data.credits || 0));
      } else {
        setProfile({ role });
        setCredits(0);
      }
    } catch (e) {
      setCredits(0);
    }
    setProfileLoading(false);
  }

  async function handleBuyCredits(priceId) {
    if (!session || !session.user) return;
    setBuying(true); setBuyError("");
    try {
      await openPaddleCheckout(priceId, session.user.email, session.user.id);
    } catch (e) {
      setBuyError(e && e.message ? e.message : "تعذّر فتح صفحة الدفع.");
    }
    setBuying(false);
  }

  const sessionRef = useRef(null);
  useEffect(() => { sessionRef.current = session; }, [session]);

  // زر الرجوع/الأمام ديال المتصفح: كنرجّعو الشاشة الصحيحة (home/login/signup/forgot) بدل ما يخرج من الموقع
  useEffect(() => {
    try { if (!window.history.state) window.history.replaceState({ view: "home" }, ""); } catch (e) {}
    function onPop(e) {
      const st = e.state;
      if (!st || !st.view) return;
      if (sessionRef.current) {
        // مستخدم داخل: ماكنرجعوش لشاشات الدخول القديمة، كنتخطاوها
        if (st.view !== "home") window.history.back();
        return;
      }
      setView(st.view); setError(""); setMsg("");
    }
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);

  useEffect(() => {
    function syncLegalHash() {
      const h = window.location.hash.replace("#", "");
      setLegalPage(h.indexOf("legal/") === 0 ? h.slice(6) : null);
      setPricingOpen(h === "pricing");
    }
    syncLegalHash();
    window.addEventListener("hashchange", syncLegalHash);
    return () => window.removeEventListener("hashchange", syncLegalHash);
  }, []);

  useEffect(() => {
    let subscription = null;
    let cancelled = false;
    (async () => {
      const client = await getSupabaseClient();
      if (cancelled) return;
      if (!client) { setConfigError(true); setReady(true); return; }
      clientRef.current = client;

      if (window.location.hash.indexOf("type=recovery") !== -1) setRecoveryMode(true);

      const { data } = await client.auth.getSession();
      if (cancelled) return;
      setSession(data.session);
      if (data.session) { try { const hs = window.history.state; if (!hs || !hs.app) window.history.replaceState({ app: true, step: "form" }, ""); } catch (e) {} }
      setReady(true);
      if (data.session) fetchProfile(client, data.session.user.id);

      const sub = client.auth.onAuthStateChange((event, newSession) => {
        setSession(newSession);
        if (event === "SIGNED_IN" && newSession) { try { const hs = window.history.state; if (!hs || !hs.app) window.history.replaceState({ app: true, step: "form" }, ""); } catch (e) {} }
        if (event === "PASSWORD_RECOVERY") setRecoveryMode(true);
        if (event === "SIGNED_OUT") { setProfile(null); setRecoveryMode(false); setView("home"); try { window.history.replaceState({ view: "home" }, ""); } catch (e) {} }
        if (newSession) fetchProfile(client, newSession.user.id);
      });
      subscription = sub.data.subscription;
    })();
    return () => { cancelled = true; if (subscription) subscription.unsubscribe(); };
  }, []);

  async function handleLogin(email, password) {
    setBusy(true); setError(""); setMsg("");
    const { error: err } = await clientRef.current.auth.signInWithPassword({ email, password });
    setBusy(false);
    if (err) setError(mapAuthError(err));
  }

  async function handleSignUp(email, password) {
    setBusy(true); setError(""); setMsg("");
    const { error: err } = await clientRef.current.auth.signUp({ email, password });
    setBusy(false);
    if (err) { setError(mapAuthError(err)); return; }
    setMsg("تم إنشاء الحساب بنجاح. إذا طُلب تأكيد البريد الإلكتروني، تحقق من بريدك ثم سجّل الدخول.");
    setView("login");
    try { window.history.replaceState({ view: "login" }, ""); } catch (e) {}
  }

  async function handleForgot(email) {
    setBusy(true); setError(""); setMsg("");
    const { error: err } = await clientRef.current.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname,
    });
    setBusy(false);
    if (err) { setError(mapAuthError(err)); return; }
    setMsg("إذا كان البريد مسجلاً لدينا، فسيصلك رابط إعادة تعيين كلمة المرور خلال دقائق.");
  }

  async function handleReset(password) {
    setBusy(true); setError(""); setMsg("");
    const { error: err } = await clientRef.current.auth.updateUser({ password });
    setBusy(false);
    if (err) { setError(mapAuthError(err)); return; }
    setRecoveryMode(false);
    window.history.replaceState(null, "", window.location.pathname + window.location.search);
  }

  async function handleLogout() {
    try { const uid = session && session.user && session.user.id; if (uid) await idbDel("lp:" + uid); } catch (e) {}
    if (clientRef.current) await clientRef.current.auth.signOut();
  }

  function switchView(v) {
    setView(v); setError(""); setMsg("");
    // نسجّل كل شاشة (login/signup/forgot) فتاريخ المتصفح باش زر الرجوع يرجع للشاشة اللي قبلها وماكيخرجش من الموقع
    try {
      const cur = window.history.state;
      if (!cur || cur.view !== v) window.history.pushState({ view: v }, "");
    } catch (e) {}
  }

  if (legalPage && LEGAL_CONTENT[legalPage]) {
    return <LegalPage type={legalPage} onBack={() => { window.location.hash = ""; }} />;
  }

  if (!ready) return <SplashLoader />;
  if (configError) return <ConfigErrorScreen />;
  if (recoveryMode) return <ResetPasswordScreen onReset={handleReset} busy={busy} error={error} msg={msg} />;

  if (pricingOpen) {
    return (
      <PricingPage
        signedIn={!!session}
        buying={buying}
        buyError={buyError}
        onBack={() => { window.location.hash = ""; }}
        onBuy={(priceId) => {
          if (session) { handleBuyCredits(priceId); return; }
          window.location.hash = "";
          setView("signup"); setError("");
          setMsg("أنشئ حسابك (أو سجّل الدخول) ثم اختر الباقة لإتمام الشراء.");
        }}
      />
    );
  }

  // Admin = صاحب المنصة (role = 'admin' فـ profiles). كيسمح ليه بالتوليد بلا خصم نقاط.
  // هاد التحقق واجهي بحت (UX فقط) — الحماية الحقيقية خاصها تكون فالـ Backend (شوف الملاحظة تحت handleGenerate).
  const isAdmin = !!(profile && profile.role === "admin");

  if (!session) {
    if (view === "home") return <HomePage onLogin={() => switchView("login")} onSignup={() => switchView("signup")} />;
    if (view === "signup") return <SignUpScreen onSignUp={handleSignUp} onSwitch={switchView} busy={busy} error={error} msg={msg} />;
    if (view === "forgot") return <ForgotPasswordScreen onForgot={handleForgot} onSwitch={switchView} busy={busy} error={error} msg={msg} />;
    return <LoginScreen onLogin={handleLogin} onSwitch={switchView} onForgot={() => switchView("forgot")} busy={busy} error={error} msg={msg} />;
  }

  return (
    <React.Fragment>
      {!editorPreview && (
        <TopBar
          email={(profile && profile.email) || session.user.email}
          credits={credits}
          loading={profileLoading}
          isAdmin={isAdmin}
          onLogout={handleLogout}
          onBuy={() => setShowBuyModal(true)}
        />
      )}
      <App
        credits={credits}
        setCredits={setCredits}
        user={session.user}
        isAdmin={isAdmin}
        onBuyCredits={() => setShowBuyModal(true)}
        onPreviewChange={setEditorPreview}
      />
      {!editorPreview && <LegalFooter />}
      <CreditsModal
        open={showBuyModal}
        onClose={() => setShowBuyModal(false)}
        onBuy={handleBuyCredits}
        buying={buying}
        buyError={buyError}
      />
    </React.Fragment>
  );
}

/* ============================== تخزين محلي (IndexedDB) لحفظ الصفحة المولّدة عند التحديث ============================== */
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("alai-store", 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("kv"); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(key, value) {
  try {
    const db = await idbOpen();
    await new Promise((res, rej) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(value, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    db.close();
  } catch (e) {}
}
async function idbGet(key) {
  try {
    const db = await idbOpen();
    const v = await new Promise((res, rej) => { const tx = db.transaction("kv", "readonly"); const q = tx.objectStore("kv").get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    db.close();
    return v;
  } catch (e) { return null; }
}
async function idbDel(key) {
  try {
    const db = await idbOpen();
    await new Promise((res, rej) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").delete(key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    db.close();
  } catch (e) {}
}

function tplSource(key) { return decodeLP(window.__LP[key]); } // قراءة فقط

function tplExtract(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const items = [];
  const w = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    const p = n.parentElement;
    if (!p || /^(SCRIPT|STYLE|NOSCRIPT|OPTION)$/.test(p.tagName)) continue;
    if (p.closest("#countdown,#hours,#minutes,#seconds,#cdText,#toastText")) continue;
    const t = n.nodeValue.trim();
    if (t.length < 2 || !/[A-Za-z\u0600-\u06FF]/.test(t)) continue;
    items.push({ node: n, text: t });
  }
  return { doc, items };
}

// يعيد كتابة نصوص مجموعة (chunk) واحدة؛ إذا طال الرد تنقسم المجموعة نصفين تلقائياً
async function rewriteTplChunk(chunk, form, country, images, extra) {
  const content = [
    { type: "text", text: buildTplPrompt(chunk.map((c) => ({ text: c.text })), form, country, extra, chunk.map((c) => c.i)) },
    ...images.map((img) => ({ type: "image", source: { type: "base64", media_type: img.mediaType, data: img.base64 } })),
  ];
  try {
    const out = await callClaude(content, true);
    return { title: out.title, texts: out.texts || {} };
  } catch (e) {
    if (chunk.length > 1 && (isTooLongError(e) || /JSON|Unexpected|position/i.test(e.message || ""))) {
      const mid = Math.ceil(chunk.length / 2);
      const fewer = images.slice(0, 2);
      const ex = "\n(هذه جزء من نصوص صفحة أطول؛ حافظ على نفس الأسلوب والمعلومات.)";
      const a = await rewriteTplChunk(chunk.slice(0, mid), form, country, fewer, ex);
      const b = await rewriteTplChunk(chunk.slice(mid), form, country, fewer, ex);
      return { title: a.title || b.title, texts: Object.assign({}, a.texts, b.texts) };
    }
    throw e;
  }
}

async function generateFromTemplate(key, form, country, images) {
  const { items } = tplExtract(tplSource(key));

  const all = items.map((it, i) => ({ i, text: it.text }));
  const r = await rewriteTplChunk(all, form, country, images.slice(0, 5), "");
  const title = r.title || form.name;
  return { designSystem: "Tech", sections: [], hero: { headline: title }, _template: key, _title: title, _texts: r.texts };
}

/* ===== تغيير ألوان القالب مجاناً (بدون أي استدعاء للذكاء الاصطناعي) ===== */
function __hexToHsl(hex) {
  let h = hex.replace("#", "");
  if (h.length <= 4) h = h.split("").map((c) => c + c).join("");
  const r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, bl = parseInt(h.slice(4, 6), 16) / 255;
  const alpha = h.length === 8 ? h.slice(6, 8) : "";
  const mx = Math.max(r, g, bl), mn = Math.min(r, g, bl), l = (mx + mn) / 2;
  let hh = 0, ss = 0;
  if (mx !== mn) {
    const d = mx - mn;
    ss = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) hh = ((g - bl) / d + (g < bl ? 6 : 0)); else if (mx === g) hh = (bl - r) / d + 2; else hh = (r - g) / d + 4;
    hh *= 60;
  }
  return { h: hh, s: ss, l, alpha };
}
function __hslToHex(h, s, l, alpha) {
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  const t = (v) => Math.round((v + m) * 255).toString(16).padStart(2, "0");
  return "#" + t(r) + t(g) + t(b) + (alpha || "");
}
function __rotateColors(css, deg) {
  return css.replace(/#([0-9a-fA-F]{8}|[0-9a-fA-F]{6}|[0-9a-fA-F]{3,4})(?![0-9a-zA-Z_-])/g, (m) => {
    const c = __hexToHsl(m);
    if (c.s < 0.15) return m; // نترك الأبيض/الأسود/الرمادي كما هو
    return __hslToHex(c.h + deg, c.s, c.l, c.alpha);
  });
}
function tplRecolor(doc, deg) {
  if (!deg) return;
  doc.querySelectorAll("style").forEach((st) => {
    st.textContent = st.textContent.replace(/\{[^{}]*\}/g, (blk) => __rotateColors(blk, deg));
  });
  doc.querySelectorAll("[style]").forEach((el) => el.setAttribute("style", __rotateColors(el.getAttribute("style") || "", deg)));
  doc.querySelectorAll("[fill],[stroke],[stop-color]").forEach((el) => {
    ["fill", "stroke", "stop-color"].forEach((a) => { if (el.hasAttribute(a)) el.setAttribute(a, __rotateColors(el.getAttribute(a), deg)); });
  });
}

/* ===== تبديل هيكل القالب مجاناً: إعادة ترتيب أقسام الصفحة (بدون أي استدعاء للذكاء الاصطناعي) ===== */
function __seedRand(seed) {
  let a = (seed >>> 0) || 1;
  return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function tplShuffleSections(doc, seed) {
  if (!seed || !doc.body) return;
  const secs = Array.from(doc.body.children).filter((el) => el.tagName === "SECTION");
  if (secs.length < 4) return;
  // نترك ثابتاً: أول قسم (الواجهة)، آخر قسم، وأي قسم فيه فورم/أزرار طلب/عدّاد
  const movable = secs.slice(1, -1).filter((el) => !el.querySelector("form,input,textarea,select,script,[id*='countdown'],[id*='order'],[id*='checkout']") && !/order|checkout|form|hero|countdown/i.test(el.id || ""));
  if (movable.length < 2) return;
  const rnd = __seedRand(seed);
  const order = movable.slice();
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = order[i]; order[i] = order[j]; order[j] = t; }
  const slots = movable.map((n) => { const ph = doc.createComment(""); n.replaceWith(ph); return ph; });
  order.forEach((n, i) => slots[i].replaceWith(n));
}

function App({ credits, setCredits, user, isAdmin, onBuyCredits, onPreviewChange }) {

  const [images, setImages] = useState([]);
  const [error, setError] = useState("");
  const [genStepIdx, setGenStepIdx] = useState(0);

  const [history, setHistory] = useState([]);
  const [historyIdx, setHistoryIdx] = useState(-1);
  const data = historyIdx >= 0 ? history[historyIdx] : null;

  const [previewMode, setPreviewMode] = useState("mobile");
  const [editCmd, setEditCmd] = useState("");
  const [editing, setEditing] = useState(false);
  const [copyStatus, setCopyStatus] = useState("");

  const country = COUNTRIES.find((c) => c.code === form.countryCode) || COUNTRIES[0];
  const tokens = data && data._paletteVariant ? data._paletteVariant : DESIGN_SYSTEMS.Tech[0];
  const heroLayout = data && data._heroLayout ? data._heroLayout : "split";

  // ---- حفظ/استرجاع الحالة (باش التحديث ماكيمسحش الصفحة المولّدة) + زر الرجوع ----
  const [hydrated, setHydrated] = useState(false);
  const stepRef = useRef(step);
  const dataRef = useRef(null);
  useEffect(() => { stepRef.current = step; }, [step]);
  dataRef.current = data;

  useEffect(() => {
    let alive = true;
    (async () => {
      const saved = user ? await idbGet("lp:" + user.id) : null;
      if (!alive) return;
      const hs = window.history.state;
      let showPreview = false;
      if (saved) {
        if (saved.form) setForm((f) => Object.assign({}, f, saved.form));
        if (Array.isArray(saved.images)) setImages(saved.images);
        if (Array.isArray(saved.history) && saved.history.length) {
          setHistory(saved.history);
          const idx = Math.min(Math.max(Number(saved.historyIdx) || 0, 0), saved.history.length - 1);
          setHistoryIdx(idx);
          const onPreviewEntry = !!(hs && hs.app && hs.step === "preview");
          showPreview = onPreviewEntry || saved.step === "preview";
          if (showPreview && !onPreviewEntry) {
            try {
              window.history.replaceState({ app: true, step: "form" }, "");
              window.history.pushState({ app: true, step: "preview" }, "");
            } catch (e) {}
          }
        }
      }
      if (showPreview) setStep("preview");
      else if (hs && hs.app && hs.step !== "form") { try { window.history.replaceState({ app: true, step: "form" }, ""); } catch (e) {} }
      setHydrated(true);
    })();
    return () => { alive = false; };
  }, []);

  useEffect(() => {
    if (!hydrated || !user) return;
    const t = setTimeout(() => {
      idbSet("lp:" + user.id, { form, images, history, historyIdx, step: step === "preview" ? "preview" : "form", savedAt: Date.now() });
    }, 500);
    return () => clearTimeout(t);
  }, [hydrated, form, images, history, historyIdx, step]);

  useEffect(() => {
    function onPop(e) {
      const st = e.state;
      if (stepRef.current === "loading") {
        // أثناء التوليد: ماكنخليوش المستخدم يخرج، كنرجعوه لنفس الشاشة
        try { window.history.pushState({ app: true, step: "loading" }, ""); } catch (er) {}
        return;
      }
      if (st && st.app && st.step === "preview" && dataRef.current) setStep("preview");
      else if (st && (st.app || st.view)) setStep("form");
    }
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);

  function goBackToForm() {
    const hs = window.history.state;
    if (hs && hs.app && hs.step === "preview") window.history.back();
    else setStep("form");
  }

  const genTimer = useRef(null);

      setGenStepIdx(0);
      genTimer.current = setInterval(() => setGenStepIdx((i) => (i < GEN_STEPS.length - 1 ? i + 1 : i)), 4500);
    } else if (genTimer.current) clearInterval(genTimer.current);
    return () => genTimer.current && clearInterval(genTimer.current);
  }, [step]);

  async function handleImageUpload(e) {
    const files = Array.from(e.target.files || []).slice(0, 8 - images.length);

      try {

        const dataUrl = await resizeImageDataUrl(rawDataUrl, 1600, 0.85);
        const parts = dataUrlParts(dataUrl);
        if (parts) next.push({ dataUrl, mediaType: parts.mediaType, base64: parts.base64 });
      } catch (e2) {}
    }
    setImages((prev) => [...prev, ...next].slice(0, 8));
    e.target.value = "";
  }
  function removeImage(i) { setImages((prev) => prev.filter((_, idx) => idx !== i)); }

  const [enhancingIdx, setEnhancingIdx] = useState(null);
  async function handleEnhanceImage(i) {
    setEnhancingIdx(i);
    try {
      const img = images[i];
      const enhancedDataUrl = await enhanceImageForAds(img.dataUrl);
      const parts = dataUrlParts(enhancedDataUrl);
      if (parts) {
        setImages((prev) => prev.map((im, idx) => idx === i ? { dataUrl: enhancedDataUrl, mediaType: parts.mediaType, base64: parts.base64 } : im));
      }
    } catch (e) { }
    setEnhancingIdx(null);
  }

  async function handleGenerate() {
    setError("");
    // Admin (صاحب المنصة) كيتوليد بلا قيد رصيد. المستخدم العادي كيبقى محتاج نقاط كيفما كان.
    if (!isAdmin && credits <= 0) {
      onBuyCredits();
      return;
    }
    if (!form.name.trim()) return setError("أدخل اسم المنتج أولاً.");
    if (!form.price) return setError("أدخل سعر المنتج أولاً.");
    if (images.length === 0) return setError("ارفع صورة واحدة على الأقل للمنتج.");
    setStep("loading");
    stepRef.current = "loading";
    try { window.history.pushState({ app: true, step: "loading" }, ""); } catch (e) {}
    try {
      // نرسل بحد أقصى 5 صور فقط لمحرك التوليد (كافية لتحليل جيد للمنتج) لتقليل حجم الطلب،
      // بينما جميع الصور المرفوعة (حتى 8) تبقى متوفرة فمعرض الصفحة النهائية
      const imagesForAI = images.slice(0, 5);
      const content = [
        { type: "text", text: buildGeneratePrompt(form, country) },
        ...imagesForAI.map((img) => ({ type: "image", source: { type: "base64", media_type: img.mediaType, data: img.base64 } })),
      ];
      // اختيار عشوائي للقالب (بلا اختيار من المستخدم)
      const tplPool = ["original", "chair", "hair", "tablet"];
      const tpl = tplPool[Math.floor(Math.random() * tplPool.length)];
      let result;
      if (tpl !== "original") {
        result = await generateFromTemplate(tpl, form, country, images);
        result._paletteVariant = DESIGN_SYSTEMS.Tech[0];
        result._heroLayout = "split";
      } else {
        const generated = await callClaudeAuto(content);
        result = await runQualityControl(generated);
        result._paletteVariant = pickDesignTokens(result.designSystem);
        result._heroLayout = pickHeroLayout();
      }

      // خصم نقطة واحدة بعد نجاح التوليد فقط. شرط credits يمنع خصماً سالباً.
      // Admin مستثنى تماماً من الخصم — التوليد عندو مجاني ومايبانش عليه أي تغيير فالرصيد.
      const previousCredits = Number(credits || 0);
      const nextCredits = Math.max(0, previousCredits - 1);
      const client = await getSupabaseClient();
      if (!isAdmin && client && user && previousCredits > 0) {
        let updateResult = await client.from("users")
          .update({ credits: nextCredits })
          .eq("id", user.id)
          .eq("credits", previousCredits)
          .select("credits")
          .single();

        // توافق مع المشروع الحالي إذا كانت النقاط ما زالت في profiles.
        if (updateResult.error) {
          updateResult = await client.from("profiles")
            .update({ credits: nextCredits })
            .eq("id", user.id)
            .eq("credits", previousCredits)
            .select("credits")
            .single();
        }
        if (updateResult.error) throw new Error("تعذّر تحديث رصيد النقاط. لم يتم اعتماد التوليد، حاول مرة أخرى.");
        setCredits(Number(updateResult.data.credits));
      }

      setHistory([result]); setHistoryIdx(0); setStep("preview");
      stepRef.current = "preview";
      try { window.history.replaceState({ app: true, step: "preview" }, ""); } catch (e) {}
    } catch (err) {
      setError(err.message || "حدث خطأ أثناء التوليد، حاول مرة أخرى.");
      setStep("form");
      stepRef.current = "form";
      try { const hs = window.history.state; if (hs && hs.step === "loading") window.history.back(); } catch (e) {}
    }
  }

  async function handleApplyEdit() {
    if (!editCmd.trim() || !data) return;
    setEditing(true); setError("");
    try {
      let result;
      if (data._template) {
        result = await editTemplatePage(data, editCmd.trim(), form, country);
        result._paletteVariant = data._paletteVariant; result._heroLayout = data._heroLayout;
      } else {
        const content = [{ type: "text", text: buildEditPrompt(data, editCmd.trim(), country) }];
        result = await callClaudeAuto(content);
        const designChanged = result.designSystem !== data.designSystem;
        result._paletteVariant = designChanged ? pickDesignTokens(result.designSystem) : data._paletteVariant;
        result._heroLayout = designChanged ? pickHeroLayout() : data._heroLayout;
      }
      const truncated = history.slice(0, historyIdx + 1);
      const nextHistory = [...truncated, result];
      setHistory(nextHistory); setHistoryIdx(nextHistory.length - 1); setEditCmd("");
    } catch (err) {
      setError(err.message || "تعذّر تنفيذ التعديل.");
    } finally { setEditing(false); }
  }

  function undo() { if (historyIdx > 0) setHistoryIdx(historyIdx - 1); }
  function redo() { if (historyIdx < history.length - 1) setHistoryIdx(historyIdx + 1); }

  async function handleShuffleDesign() {
    if (!data) return;
    if (data._template) {
      // مجاني: ألوان جديدة + ترتيب أقسام جديد (الواجهة وقسم الطلب يبقاو في مكانهم)
      const hue = 40 + Math.floor(Math.random() * 280);
      const seed = 1 + Math.floor(Math.random() * 2147483000);
      const r = Object.assign({}, data, { _hue: hue, _seed: seed });
      const nh = [...history.slice(0, historyIdx + 1), r];
      setHistory(nh); setHistoryIdx(nh.length - 1);
      return;
    }
    const allSystems = Object.keys(DESIGN_SYSTEMS);
    const otherSystems = allSystems.filter((s) => s !== data.designSystem);
    const nextSystem = otherSystems[Math.floor(Math.random() * otherSystems.length)] || data.designSystem;
    const next = Object.assign({}, data, {
      designSystem: nextSystem,
      _paletteVariant: pickDesignTokens(nextSystem),
      _heroLayout: pickHeroLayout(),
    });
    const truncated = history.slice(0, historyIdx + 1);
    const nextHistory = [...truncated, next];
    setHistory(nextHistory); setHistoryIdx(nextHistory.length - 1);
  }

  const htmlString = React.useMemo(() => {
    if (!data) return "";
    return data._template ? tplApply(data, images, form, country) : buildStandaloneHTML(data, tokens, images, form, country);
  }, [data, images, form.name, form.price, form.priceOld, form.whatsapp, form.countryCode, form.showOrderForm]);

  async function copyHTML() {
    try { await navigator.clipboard.writeText(htmlString); setCopyStatus("تم نسخ الكود ✓"); }
    catch { setCopyStatus("تعذّر النسخ التلقائي، استخدم زر التحميل"); }
    setTimeout(() => setCopyStatus(""), 2500);
  }
  function downloadHTML() {
    const blob = new Blob([htmlString], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = (form.name || "landing-page").trim().replace(/\s+/g, "-") + ".html";
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }

  if (!hydrated) return <SplashLoader />;

  return (
    <div dir="rtl" style={{ fontFamily: "'Cairo', sans-serif", minHeight: "100vh", background: "#0B0F19" }}>
      {step === "form" && <FormScreen form={form} setForm={setForm} images={images} onUpload={handleImageUpload} onRemoveImage={removeImage} onEnhanceImage={handleEnhanceImage} enhancingIdx={enhancingIdx} error={error} onGenerate={handleGenerate} />}
      {step === "loading" && <LoadingScreen stepIdx={genStepIdx} />}
      {step === "preview" && data && (
        <PreviewScreen data={data} tokens={tokens} images={images} form={form} country={country}
          previewMode={previewMode} setPreviewMode={setPreviewMode}
          editCmd={editCmd} setEditCmd={setEditCmd} onApplyEdit={handleApplyEdit} editing={editing}
          canUndo={historyIdx > 0} canRedo={historyIdx < history.length - 1} onUndo={undo} onRedo={redo}
          onCopy={copyHTML} onDownload={downloadHTML} copyStatus={copyStatus} error={error}
          onShuffleDesign={handleShuffleDesign}
          tplHtml={htmlString}
          onBack={goBackToForm}
          onBuyCredits={onBuyCredits}
          onPreviewChange={onPreviewChange} />
      )}
    </div>
  );
}

function PreviewScreen(props) {
  const {
    data, tokens, images, form, country, previewMode, setPreviewMode,
    editCmd, setEditCmd, onApplyEdit, editing, canUndo, canRedo,
    onUndo, onRedo, onDownload, error, onBack, onShuffleDesign,
    onBuyCredits, onPreviewChange, tplHtml
  } = props;

  const captureRef = useRef(null);
  const [imageLoading, setImageLoading] = useState(false);
  const [previewOnly, setPreviewOnly] = useState(false);
  const [moreOpen, setMoreOpen] = useState(false);

  useEffect(() => {
    if (onPreviewChange) onPreviewChange(previewOnly);
    return () => { if (onPreviewChange) onPreviewChange(false); };
  }, [previewOnly]);

  async function exportImage() {
    if (!captureRef.current || !window.html2canvas || imageLoading) return;
    setImageLoading(true);
    try {
      let el = captureRef.current;
      const fr = el.querySelector("iframe");
      if (fr && fr.contentDocument) {
        const d = fr.contentDocument;
        const st = d.createElement("style");
        st.textContent = ".rev,.reveal{opacity:1!important;transform:none!important}";
        d.head.appendChild(st);
        el = d.body;
      }
      try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
      // Use the real visible width of the page (NOT scrollWidth, which includes fixed/overflowing
      // elements and caused the blank margin) and a full-page height.
      const W = Math.round(el.getBoundingClientRect().width);
      const H = Math.ceil(el.scrollHeight);
      // High quality, but keep the canvas within mobile browser limits.
      const maxSide = 16000, maxArea = 40e6;
      let scale = 3;
      scale = Math.min(scale, maxSide / H, Math.sqrt(maxArea / (W * H)));
      scale = Math.max(1, scale);
      const canvas = await window.html2canvas(el, {
        scale: scale,
        backgroundColor: tokens.bg,
        useCORS: true,
        allowTaint: false,
        logging: false,
        imageTimeout: 20000,
        x: 0, y: 0,
        scrollX: 0, scrollY: 0,
        width: W,
        height: H,
        windowWidth: W,
        windowHeight: H,
        onclone: (doc, cloned) => {
          // Flatten sticky/fixed elements so they render in normal flow, once, at the right width
          const all = cloned.querySelectorAll("*");
          all.forEach((n) => {
            const cs = doc.defaultView.getComputedStyle(n);
            if (cs.position === "fixed") { n.style.display = "none"; }
            else if (cs.position === "sticky") { n.style.position = "relative"; n.style.top = "auto"; }
            n.style.animation = "none";
            n.style.transition = "none";
          });
          cloned.style.width = W + "px";
          cloned.style.maxWidth = W + "px";
          cloned.style.margin = "0";
          cloned.style.overflow = "hidden";
        }
      });
      const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
      const url = blob ? URL.createObjectURL(blob) : canvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = url;
      a.download = (form.name || "landing-page").trim().replace(/\s+/g, "-") + ".png";
      document.body.appendChild(a); a.click(); a.remove();
      if (blob) setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (e) {
      console.error("Image export failed", e);
    } finally {
      setImageLoading(false);
    }
  }

  if (previewOnly) {
    return (
      <div dir="rtl" style={{ minHeight: "100vh", background: "#05070C" }}>
        <div ref={captureRef}>
          {data._template
            ? <TemplateFrame html={tplHtml} height="100vh" />
            : <LandingPage data={data} tokens={tokens} images={images} form={form} country={country} />}
        </div>
        <button
          className="floating-editor-back"
          onClick={() => setPreviewOnly(false)}
          aria-label="العودة للمحرر"
        >
          ← العودة للمحرر
        </button>
      </div>
    );
  }

  return (
    <div dir="rtl" style={{ minHeight: "100vh", display: "flex", flexDirection: "column", background: "#05070C" }}>
      <div className="editor-toolbar">
        <div className="toolbar-main">
          <button onClick={onBack} className="editor-tool"><SvgIcon name="back" size={14} /><span>رجوع</span></button>
          <button onClick={onShuffleDesign} className="editor-tool editor-design"><SvgIcon name="sparkle" size={14} /><span>تصميم</span></button>
          <button onClick={onDownload} className="editor-tool tool-dl" title="تنزيل كملف HTML"><SvgIcon name="download" size={14} /><span>HTML</span></button>
          <button onClick={exportImage} disabled={imageLoading} className="editor-tool tool-dl" title="تنزيل كصورة PNG"><SvgIcon name="image" size={14} /><span>{imageLoading ? "..." : "PNG"}</span></button>
          <button onClick={() => setPreviewOnly(true)} className="editor-tool"><SvgIcon name="eye" size={14} /><span>معاينة</span></button>

          <div className="toolbar-more-wrap">
            <button className="editor-tool toolbar-more" onClick={() => setMoreOpen((v) => !v)}><SvgIcon name="dotsv" size={18} /><span>المزيد</span></button>
            {moreOpen && (
              <div className="toolbar-dropdown">
                <button onClick={() => { setPreviewMode("mobile"); setMoreOpen(false); }}><SvgIcon name="mobile" size={14} /> عرض Mobile</button>
                <button onClick={() => { setPreviewMode("desktop"); setMoreOpen(false); }}><SvgIcon name="desktop" size={14} /> عرض Desktop</button>
                <button disabled={!canUndo} onClick={() => { onUndo(); setMoreOpen(false); }}><SvgIcon name="undo" size={14} /> تراجع</button>
                <button disabled={!canRedo} onClick={() => { onRedo(); setMoreOpen(false); }}><SvgIcon name="redo" size={14} /> إعادة</button>
                <button onClick={() => { onBuyCredits(); setMoreOpen(false); }}><SvgIcon name="bolt" size={14} /> شراء نقاط</button>
              </div>
            )}
          </div>

          <div className="device-switch">
            <button onClick={() => setPreviewMode("mobile")} className={previewMode === "mobile" ? "active" : ""}><SvgIcon name="mobile" size={14} /></button>
            <button onClick={() => setPreviewMode("desktop")} className={previewMode === "desktop" ? "active" : ""}><SvgIcon name="desktop" size={14} /></button>
          </div>
        </div>

        {error && <div style={{ color: "#F87171", fontSize: 12, textAlign: "center", padding: "6px 0", background: "#0E1526" }}>{error}</div>}
      </div>

      <div style={{ flex: 1, padding: "28px 16px", display: "flex", justifyContent: "center" }}>
        <div style={{ width: previewMode === "mobile" ? 390 : "100%", maxWidth: previewMode === "mobile" ? 390 : 1100, borderRadius: previewMode === "mobile" ? 30 : 16, overflow: "hidden", border: previewMode === "mobile" ? "8px solid #1B1F2B" : "1px solid #1D2740", boxShadow: "0 30px 60px rgba(0,0,0,.5)", height: "fit-content" }}>
          <div ref={captureRef}>
            {data._template
              ? <TemplateFrame html={tplHtml} height="calc(100vh - 150px)" />
              : <LandingPage data={data} tokens={tokens} images={images} form={form} country={country} />}
          </div>
        </div>
      </div>
    </div>
  );
}
const toolBtn = { display: "flex", alignItems: "center", gap: 6, background: "#131A2A", border: "1px solid #202A42", color: "#E2E8F5", fontSize: 12.5, fontWeight: 600, padding: "8px 12px", borderRadius: 8, cursor: "pointer" };
const segBtn = { border: "none", borderRadius: 6, padding: "6px 9px", cursor: "pointer", display: "flex" };

function LandingPage({ data, tokens, images, form, country }) {
  const sections = data.sections || [];
  const heroLayout = data._heroLayout || "split";
  const dna = styleDNA(data.designSystem);
  const btnRadius = buttonRadius(dna.button, tokens.radius);
  const btnShadow = ctaShadow(dna.shadow, tokens.primary);
  const badgeExtra = dna.badge === "outline" ? { background: "transparent", border: "1.5px solid " + tokens.primary, color: tokens.primary } : dna.badge === "ribbon" ? { borderRadius: "4px 4px 4px 0" } : { borderRadius: 999 };
  const [orderState, setOrderState] = useState({ name: "", phone: "", city: "", address: "" });
  const [orderSent, setOrderSent] = useState(false);
  const [toast, setToast] = useState(null);
  const [exitShown, setExitShown] = useState(false);

  const [showStickyCta, setShowStickyCta] = useState(false);

  const [lightboxIndex, setLightboxIndex] = useState(null);
  const touchStartX = useRef(null);
  useEffect(() => {
    if (lightboxIndex === null) return;
    function onKey(e) {
      if (e.key === "Escape") setLightboxIndex(null);
      if (e.key === "ArrowRight") setLightboxIndex((i) => (i + 1) % images.length);
      if (e.key === "ArrowLeft") setLightboxIndex((i) => (i - 1 + images.length) % images.length);
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [lightboxIndex, images.length]);
  function onLightboxTouchStart(e) { touchStartX.current = e.touches[0].clientX; }
  function onLightboxTouchEnd(e) {
    if (touchStartX.current === null) return;
    const diff = e.changedTouches[0].clientX - touchStartX.current;
    if (Math.abs(diff) > 40) {
      setLightboxIndex((i) => diff > 0 ? (i - 1 + images.length) % images.length : (i + 1) % images.length);
    }
    touchStartX.current = null;
  }
  const heroSentinelRef = useRef(null);
  const orderRef = useRef(null);
  useEffect(() => {
    let pastHero = false, atOrder = false;
    const update = () => setShowStickyCta(pastHero && !atOrder);
    const heroObs = new IntersectionObserver((entries) => { pastHero = !entries[0].isIntersecting; update(); }, { threshold: 0 });
    const orderObs = new IntersectionObserver((entries) => { atOrder = entries[0].isIntersecting; update(); }, { threshold: 0.15 });
    if (heroSentinelRef.current) heroObs.observe(heroSentinelRef.current);
    if (orderRef.current) orderObs.observe(orderRef.current);
    return () => { heroObs.disconnect(); orderObs.disconnect(); };
  }, []);

  const [secondsLeft, setSecondsLeft] = useState(0);
  useEffect(() => {
    const key = "deadline_" + (form.name || "p").replace(/[^a-zA-Z0-9]/g, "").slice(0, 24);
    let deadline = localStorage.getItem(key);
    if (!deadline || new Date(deadline) < new Date()) {
      deadline = new Date(Date.now() + 1000 * 60 * 60 * 36).toISOString();
      localStorage.setItem(key, deadline);
    }
    const tick = () => setSecondsLeft(Math.max(0, Math.round((new Date(deadline) - new Date()) / 1000)));
    tick();
    const t = setInterval(tick, 1000);
    return () => clearInterval(t);
  }, [form.name]);
  const hh = String(Math.floor(secondsLeft / 3600)).padStart(2, "0");
  const mm = String(Math.floor((secondsLeft % 3600) / 60)).padStart(2, "0");
  const ss = String(secondsLeft % 60).padStart(2, "0");

  useEffect(() => {
    const pool = socialProofPool(form.countryCode);
    function show() {
      const r = pool[Math.floor(Math.random() * pool.length)];
      setToast(r[0] + " من " + r[1] + " طلب المنتج للتو");
      setTimeout(() => setToast(null), 4500);
    }
    const t1 = setTimeout(show, 4000);
    const t2 = setInterval(show, 15000);
    return () => { clearTimeout(t1); clearInterval(t2); };
  }, [form.countryCode]);

  const hasContact = !!form.whatsapp;
  const waLink = hasContact ? "https://wa.me/" + country.phoneCode.replace("+", "") + form.whatsapp : "";
  const callLink = hasContact ? "tel:" + country.phoneCode + form.whatsapp : "";

  const priceOld = form.priceOld && Number(form.priceOld) > Number(form.price) ? form.priceOld : null;
  const discountPercent = priceOld ? Math.round((1 - Number(form.price) / Number(priceOld)) * 100) : null;

  const showOrderForm = form.showOrderForm !== false;
  const primaryCtaHref = showOrderForm ? "#order" : (hasContact ? waLink : (hasContact ? callLink : "#order"));

  const secondaryImages = images.slice(1);
  function SectionImage({ idx }) {
    const img = secondaryImages[idx];
    if (!img) return null;
    return (
      <div style={{ padding: "4px 20px 24px" }}>
        <img src={img.dataUrl} alt={form.name} onClick={() => setLightboxIndex(idx + 1)} style={{ width: "100%", maxHeight: 260, objectFit: "cover", borderRadius: tokens.radius, display: "block", cursor: "zoom-in" }} />
      </div>
    );
  }

  function Lightbox() {
    if (lightboxIndex === null || !images[lightboxIndex]) return null;
    return (
      <div
        onTouchStart={onLightboxTouchStart} onTouchEnd={onLightboxTouchEnd}
        style={{ position: "fixed", inset: 0, zIndex: 500, background: "rgba(0,0,0,.92)", display: "flex", alignItems: "center", justifyContent: "center" }}
        onClick={(e) => { if (e.target === e.currentTarget) setLightboxIndex(null); }}
      >
        <button onClick={() => setLightboxIndex(null)} aria-label="إغلاق" style={{ position: "absolute", top: 16, left: 16, width: 40, height: 40, borderRadius: "50%", background: "rgba(255,255,255,.12)", border: "none", color: "#fff", fontSize: 18, cursor: "pointer" }}>✕</button>
        {images.length > 1 && (
          <button onClick={() => setLightboxIndex((i) => (i - 1 + images.length) % images.length)} aria-label="السابق" style={{ position: "absolute", right: 12, width: 44, height: 44, borderRadius: "50%", background: "rgba(255,255,255,.12)", border: "none", color: "#fff", fontSize: 20, cursor: "pointer" }}>›</button>
        )}
        <img src={images[lightboxIndex].dataUrl} alt={form.name} style={{ maxWidth: "90%", maxHeight: "82%", objectFit: "contain", borderRadius: 8 }} />
        {images.length > 1 && (
          <button onClick={() => setLightboxIndex((i) => (i + 1) % images.length)} aria-label="التالي" style={{ position: "absolute", left: 12, width: 44, height: 44, borderRadius: "50%", background: "rgba(255,255,255,.12)", border: "none", color: "#fff", fontSize: 20, cursor: "pointer" }}>‹</button>
        )}
        {images.length > 1 && (
          <div style={{ position: "absolute", bottom: 20, display: "flex", gap: 6 }}>
            {images.map((_, i) => <span key={i} style={{ width: 7, height: 7, borderRadius: "50%", background: i === lightboxIndex ? "#fff" : "rgba(255,255,255,.35)" }} />)}
          </div>
        )}
      </div>
    );
  }

  return (
    <div dir="rtl" style={{ background: tokens.bg, color: tokens.text, fontFamily: "'Cairo', sans-serif", position: "relative" }}>
      <div style={{ position: "sticky", top: 0, zIndex: 30, background: "linear-gradient(90deg," + tokens.primaryDeep + "," + tokens.primary + ")", color: "#fff", textAlign: "center", fontWeight: 700, fontSize: 11, padding: "7px 8px", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
        <span style={{ width: 7, height: 7, borderRadius: "50%", background: "#fff", animation: "pulseDot 1.4s ease-in-out infinite" }} />
        العرض ينتهي خلال {hh}:{mm}:{ss}
      </div>

      {heroLayout === "fullbleed" && images.length > 0 ? (
        <section style={{ position: "relative" }}>
          <img src={images[0].dataUrl} alt={form.name} onClick={() => setLightboxIndex(0)} style={{ width: "100%", height: 340, objectFit: "cover", display: "block", cursor: "zoom-in" }} />
          <div style={{ position: "absolute", inset: 0, background: "linear-gradient(to top," + tokens.bg + " 15%, transparent 60%)" }} />
          <div style={{ position: "relative", padding: "0 20px 20px", marginTop: -70 }}>
            {data.hero && data.hero.eyebrow && <span style={Object.assign({ display: "inline-block", fontSize: 12, fontWeight: 700, color: tokens.accent, background: tokens.surface, padding: "4px 12px", marginBottom: 12 }, badgeExtra)}>{data.hero.eyebrow}</span>}
            <h1 style={{ fontFamily: "'" + dna.heading + "', sans-serif", fontSize: 24, fontWeight: 900, marginBottom: 8, color: tokens.text }}>{data.hero && data.hero.headline}</h1>
            <p style={{ fontSize: 14, color: tokens.muted, marginBottom: 14 }}>{data.hero && data.hero.subheadline}</p>
            <div style={{ background: tokens.card, borderRadius: tokens.radius, padding: 14, marginBottom: 14 }}>
              <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginBottom: 8 }}>
                <span style={{ fontSize: 24, fontWeight: 900, color: tokens.primary }}>{formatPrice(form.price, country)}</span>
                {priceOld && <span style={{ fontSize: 14, color: tokens.muted, textDecoration: "line-through" }}>{formatPrice(priceOld, country)}</span>}
                {discountPercent && <span style={{ fontSize: 11, fontWeight: 800, color: "#fff", background: "#E63946", padding: "3px 9px", borderRadius: 999 }}>خصم {discountPercent}%</span>}
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>{(data.hero && data.hero.badges || []).map((b, i) => <span key={i} style={{ fontSize: 11, fontWeight: 600, color: tokens.muted }}>✓ {b}</span>)}</div>
            </div>
            <a href={primaryCtaHref} style={{ display: "block", textAlign: "center", background: tokens.primary, color: tokens.mood === "dark" ? tokens.bg : "#fff", fontWeight: 800, fontSize: 15.5, padding: 15, borderRadius: btnRadius, boxShadow: btnShadow, textDecoration: "none", fontFamily: "'" + dna.heading + "', sans-serif" }}>{(data.hero && data.hero.ctaText) || "اطلب الآن"}</a>
          </div>
        </section>
      ) : heroLayout === "centered" ? (
        <section style={{ padding: "28px 20px 20px", textAlign: "center" }}>
          {data.hero && data.hero.eyebrow && <span style={Object.assign({ display: "inline-block", fontSize: 12, fontWeight: 700, color: tokens.accent, background: tokens.surface, padding: "4px 12px", marginBottom: 14 }, badgeExtra)}>{data.hero.eyebrow}</span>}
          <h1 style={{ fontFamily: "'" + dna.heading + "', sans-serif", fontSize: 24, fontWeight: 900, marginBottom: 10 }}>{data.hero && data.hero.headline}</h1>
          <p style={{ fontSize: 14, color: tokens.muted, marginBottom: 20, maxWidth: 320, marginLeft: "auto", marginRight: "auto" }}>{data.hero && data.hero.subheadline}</p>
          {images.length > 0 && (
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 20 }}>
              <div style={{ position: "relative", width: 220, height: 220, borderRadius: "50%", background: "radial-gradient(circle," + tokens.primary + "33, transparent 70%)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                <img src={images[0].dataUrl} alt={form.name} onClick={() => setLightboxIndex(0)} style={{ width: 190, height: 190, objectFit: "cover", borderRadius: "50%", border: "4px solid " + tokens.surface, boxShadow: btnShadow, cursor: "zoom-in" }} />
              </div>
            </div>
          )}
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "center", gap: 10, marginBottom: 10 }}>
            <span style={{ fontSize: 26, fontWeight: 900, color: tokens.primary }}>{formatPrice(form.price, country)}</span>
            {priceOld && <span style={{ fontSize: 15, color: tokens.muted, textDecoration: "line-through" }}>{formatPrice(priceOld, country)}</span>}
            {discountPercent && <span style={{ fontSize: 12, fontWeight: 800, color: "#fff", background: "#E63946", padding: "3px 9px", borderRadius: 999 }}>خصم {discountPercent}%</span>}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", gap: 8, marginBottom: 18 }}>
            {(data.hero && data.hero.badges || []).map((b, i) => <span key={i} style={{ fontSize: 11.5, fontWeight: 600, color: tokens.muted, background: tokens.surface, padding: "5px 10px", borderRadius: 999 }}>{b}</span>)}
          </div>
          <a href={primaryCtaHref} style={{ display: "inline-block", textAlign: "center", background: tokens.primary, color: tokens.mood === "dark" ? tokens.bg : "#fff", fontWeight: 800, fontSize: 15.5, padding: "15px 40px", borderRadius: btnRadius, boxShadow: btnShadow, textDecoration: "none", fontFamily: "'" + dna.heading + "', sans-serif" }}>{(data.hero && data.hero.ctaText) || "اطلب الآن"}</a>
        </section>
      ) : (
        <section style={{ padding: "24px 20px 20px" }}>
          {data.hero && data.hero.eyebrow && <span style={Object.assign({ display: "inline-block", fontSize: 12, fontWeight: 700, color: tokens.accent, background: tokens.surface, padding: "4px 12px", marginBottom: 12 }, badgeExtra)}>{data.hero.eyebrow}</span>}
          <h1 style={{ fontFamily: "'" + dna.heading + "', sans-serif", fontSize: 25, fontWeight: 900, marginBottom: 10 }}>{data.hero && data.hero.headline}</h1>
          <p style={{ fontSize: 14.5, color: tokens.muted, marginBottom: 16 }}>{data.hero && data.hero.subheadline}</p>
          {images.length > 0 && (
            <img src={images[0].dataUrl} alt={form.name} onClick={() => setLightboxIndex(0)} style={{ width: "100%", maxHeight: 320, objectFit: "cover", borderRadius: tokens.radius, display: "block", marginBottom: 16, cursor: "zoom-in" }} />
          )}
          <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginBottom: 10 }}>
            <span style={{ fontSize: 26, fontWeight: 900, color: tokens.primary }}>{formatPrice(form.price, country)}</span>
            {priceOld && <span style={{ fontSize: 15, color: tokens.muted, textDecoration: "line-through" }}>{formatPrice(priceOld, country)}</span>}
            {discountPercent && <span style={{ fontSize: 12, fontWeight: 800, color: "#fff", background: "#E63946", padding: "3px 9px", borderRadius: 999 }}>خصم {discountPercent}%</span>}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 18 }}>
            {(data.hero && data.hero.badges || []).map((b, i) => <span key={i} style={{ fontSize: 11.5, fontWeight: 600, color: tokens.muted, background: tokens.surface, padding: "5px 10px", borderRadius: 999 }}>{b}</span>)}
          </div>
          <a href={primaryCtaHref} style={{ display: "block", textAlign: "center", background: tokens.primary, color: tokens.mood === "dark" ? tokens.bg : "#fff", fontWeight: 800, fontSize: 15.5, padding: 15, borderRadius: btnRadius, boxShadow: btnShadow, textDecoration: "none", fontFamily: "'" + dna.heading + "', sans-serif" }}>{(data.hero && data.hero.ctaText) || "اطلب الآن"}</a>
        </section>
      )}

      <div ref={heroSentinelRef} style={{ height: 1 }} />

      {sections.includes("urgency") && data.urgency && (
        <section style={{ padding: "0 20px 20px" }}>
          <div style={{ background: tokens.card, borderRadius: tokens.radius, padding: 14, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontWeight: 700, fontSize: 13 }}>{data.urgency.stockLabel}</span>
            <span style={{ color: tokens.accent, fontWeight: 800, fontSize: 13 }}>{data.urgency.countdownLabel}</span>
          </div>
        </section>
      )}

      {sections.includes("problem") && data.problem && (
        <Section title={data.problem.title} tokens={tokens}>
          <div style={{ background: tokens.card, borderRadius: tokens.radius, padding: 16, borderRight: "3px solid " + tokens.accent2 }}>
            <p style={{ fontSize: 13, lineHeight: 1.8, color: tokens.text }}>{data.problem.text}</p>
          </div>
        </Section>
      )}

      {sections.includes("solution") && data.solution && (
        <Section title={data.solution.title} tokens={tokens}>
          <div style={{ background: tokens.card, borderRadius: tokens.radius, padding: 16, borderRight: "3px solid " + tokens.primary }}>
            <p style={{ fontSize: 13, lineHeight: 1.8, color: tokens.text }}>{data.solution.text}</p>
          </div>
        </Section>
      )}

      {sections.includes("beforeAfter") && data.beforeAfter && (
        <Section title={data.beforeAfter.title} tokens={tokens}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <div style={{ background: tokens.bg, border: "1px solid " + tokens.muted + "33", borderRadius: tokens.radius, padding: 14, textAlign: "center" }}>
              <div style={{ fontSize: 11, fontWeight: 800, color: tokens.muted, marginBottom: 6 }}>{data.beforeAfter.beforeLabel || "قبل"}</div> 
              <div style={{ fontSize: 12, color: tokens.muted, lineHeight: 1.7 }}>{data.beforeAfter.beforeText}</div>
            </div>
            <div style={{ background: tokens.card, border: "1px solid " + tokens.primary, borderRadius: tokens.radius, padding: 14, textAlign: "center" }}>
              <div style={{ fontSize: 11, fontWeight: 800, color: tokens.primary, marginBottom: 6 }}>{data.beforeAfter.afterLabel || "بعد"}</div>
              <div style={{ fontSize: 12, lineHeight: 1.7 }}>{data.beforeAfter.afterText}</div>
            </div>
          </div>
        </Section>
      )}

      {sections.includes("features") && data.features && (
        <Section title={data.features.title} tokens={tokens}>
          <div style={{ display: "grid", gap: 12 }}>
            {(data.features.items || []).map((it, i) => (
              <div key={i} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                <ContentIcon name={it.icon} size={20} color={tokens.primary} style={{ flexShrink: 0, marginTop: 2 }} />
                <div><div style={{ fontWeight: 700, fontSize: 14 }}>{it.title}</div><div style={{ fontSize: 12.5, color: tokens.muted, marginTop: 3, lineHeight: 1.7 }}>{it.desc}</div></div>
              </div>
            ))}
          </div>
        </Section>
      )}
      <SectionImage idx={0} />

      {sections.includes("benefits") && data.benefits && (
        <Section title={data.benefits.title} tokens={tokens}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            {(data.benefits.items || []).map((it, i) => (
              <div key={i} style={{ background: tokens.card, borderRadius: tokens.radius, padding: 14, textAlign: "center" }}>
                <ContentIcon name={it.icon} size={20} color={tokens.accent} style={{ margin: "0 auto 8px" }} />
                <div style={{ fontWeight: 700, fontSize: 13 }}>{it.title}</div>
                <div style={{ fontSize: 11.5, color: tokens.muted, marginTop: 4, lineHeight: 1.6 }}>{it.desc}</div>
              </div>
            ))}
          </div>
        </Section>
      )}

      {sections.includes("howToUse") && data.howToUse && (
        <Section title={data.howToUse.title} tokens={tokens}>
          <div style={{ display: "grid", gap: 10 }}>
            {(data.howToUse.steps || []).map((s, i) => (
              <div key={i} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                <div style={{ width: 24, height: 24, borderRadius: "50%", background: tokens.primary, color: "#fff", fontSize: 12, fontWeight: 800, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{i + 1}</div>
                <div style={{ fontSize: 13, lineHeight: 1.8, paddingTop: 2 }}>{s}</div>
              </div>
            ))}
          </div>
        </Section>
      )}
      <SectionImage idx={1} />

      {sections.includes("specs") && data.specs && (
        <Section title={data.specs.title} tokens={tokens}>
          <div style={{ background: tokens.card, borderRadius: tokens.radius, overflow: "hidden" }}>
            {(data.specs.items || []).map((it, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "10px 14px", borderBottom: i < data.specs.items.length - 1 ? "1px solid " + tokens.bg : "none", fontSize: 12.5 }}>
                <span style={{ color: tokens.muted }}>{it.label}</span><span style={{ fontWeight: 700 }}>{it.value}</span>
              </div>
            ))}
          </div>
        </Section>
      )}

      {sections.includes("compare") && data.compare && (
        <Section title={data.compare.title} tokens={tokens}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <div style={{ background: tokens.bg, border: "1px solid " + tokens.muted + "33", borderRadius: tokens.radius, padding: 12 }}>
              <div style={{ fontWeight: 800, fontSize: 12, marginBottom: 8, color: tokens.muted }}>✗ الطريقة التقليدية</div>
              <div style={{ display: "grid", gap: 6 }}>{(data.compare.them || []).map((t, i) => <div key={i} style={{ fontSize: 11.5, color: tokens.muted }}>✗ {t}</div>)}</div>
            </div>
            <div style={{ background: tokens.card, border: "1px solid " + tokens.primary, borderRadius: tokens.radius, padding: 12 }}>
              <div style={{ fontWeight: 800, fontSize: 12, marginBottom: 8 }}>✓ {data.compare.productLabel || form.name}</div>
              <div style={{ display: "grid", gap: 6 }}>{(data.compare.us || []).map((t, i) => <div key={i} style={{ fontSize: 11.5 }}>✓ {t}</div>)}</div>
            </div>
          </div>
        </Section>
      )}
      <SectionImage idx={2} />

      {sections.includes("whatsIncluded") && data.whatsIncluded && (
        <Section title={data.whatsIncluded.title} tokens={tokens}>
          <div style={{ background: tokens.card, borderRadius: tokens.radius, padding: 14, display: "grid", gap: 8 }}>
